<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Developer Dojo write check</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 12px; color: #1b1b1f; background: #fff; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; }
</style>
</head>
<body>
<p id="status">Waiting for the plugin's report.</p>
<pre id="report"></pre>
<script>
  // The plugin's UI: it tells the plugin it is ready, then shows the report the plugin sends back.
  // The check script reads #report from this frame.
  window.addEventListener('message', (event) => {
    const message = event.data;
    if (!message || message.type !== 'report') return;
    document.getElementById('status').textContent = message.report && message.report.ok ? 'Written.' : 'The write failed.';
    document.getElementById('report').textContent = JSON.stringify(message.report);
  });
  parent.postMessage({ type: 'ready' }, '*');
</script>
</body>
</html>
