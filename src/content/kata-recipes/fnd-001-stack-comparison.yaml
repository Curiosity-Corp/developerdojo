  failures:
    - observed: >-
        Instructions and model comparison (ARN-001): pressed-state failed in three of nine first runs (baseline-r2,
        instructions-r1 and instructions-r3). The plant buttons changed their label but exposed no aria-pressed. No
        other check failed.
      correction: >-
        One correction round each, in a fresh session with the checker's observation. All three corrected files passed
        every check.
    - observed: >-
        Harness comparison (ARN-003): pressed-state failed in claude-code-r1, claude-code-r3 and qwen-code-r3, and
        claude-code-r3 also failed axe-serious (colour contrast).
      correction: >-
        One correction round each, in a fresh process of the same harness. All three corrected files passed every
