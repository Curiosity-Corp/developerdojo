adaptation:
  variations:
    - change: Software (run by the Dojo, this recipe).
      effect: A single-file web prototype scored by an independent browser checker; the controlled comparisons above.
    - change: Visual or document (proposed, not run by the Dojo).
      effect: >-
        Generate a one-page event poster from a fixed brief, check its text, contrast ratio and print size against
        written criteria, and change only the model.
    - change: 3D or BIM (proposed, not run by the Dojo).
      effect: >-
        Ask an assistant to list the walls and their types in the buildingSMART sample IFC file used in the "Investigate
        a real IFC model" kata, check the list against the file, and change only the instructions.
    - change: A phone or browser app instead of the CLI (proposed, not run by the Dojo).
      effect: >-
        Use the same prompts and check sheet, and record versions and cost as "not shown" where the app hides them.
        This is a harness change, so do not mix it into another comparison.
randori:
  challenge: >-
    Unseen challenge: a one-file "Tool Library" page lists five shared tools (two power tools, three hand tools),
    filters them by type, and lets the user mark a tool "Borrowed" and back. A borrowed tool shows who has it, using a
    name typed into a field that must have a visible label.
  constraints:
    - Write at least eight observable checks before you prompt.
    - Change one variable you have not changed before, with three runs per arm.
    - Fictional names and data only.
    - Not run by the Dojo, so there is no reference answer. Your checks are the rubric.
  evaluation: >-
    A reviewer reads your checks, repeats at least two of them on your saved HTML, and confirms that your record
    reports failures and corrections without overstating the result. The changed data, the form field and the extra
    state mean a stack tuned to Pocket Garden can fail it.
maintenance:
  cadence: >-
    Quarterly, and whenever Claude Code changes major version or its print-mode flags change, a model named here is
    retired or renamed, a rubric check stops passing on the reference, or a learner reports a different smoke-test
    result.
  caveats:
    - Model behaviour, prices and CLI flags change. These results are from 20 and 21 November 2026; run them again before you rely on them.
    - Three runs per arm on one small task are observations to repeat, not effects, and not a ranking of models, prompts or harnesses.
    - >-
      Costs are list prices reported by the CLI (ARN-001) or what the endpoint billed (ARN-003), not an invoice. A
      subscription bills differently and was not measured.
    - The accessibility checks are practice checks, not a WCAG conformance claim for any page.
    - >-
      The brief asks for both a changing label and a pressed state, which the WAI-ARIA button pattern
      (https://www.w3.org/WAI/ARIA/apg/patterns/button/) advises against combining. Every pressed-state failure was on
      that check, so question the brief in your reflection.
downloads:
  - filename: fnd-001-check-sheet.md
    description: The 14 checks, with how to check each one by hand and a column per run.
    content: |-
      # Pocket Garden check sheet (FND-001)

      Score every saved answer against all 14 checks before you read the other arm. Write pass, fail or "not checked". Never leave a cell blank, and never count "not checked" as a pass.

      Check the reference page (/examples/pocket-garden.html) first. It passes all 14 checks. If it fails one on your setup, fix how you are checking before you score any run.

      | # | Check | What passes | It fails when | How to check by hand | Run 1 | Run 2 | Run 3 |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | 1 | single-html-block | The response holds exactly one complete HTML code block. | No block, or several. | Count the code blocks in the answer. |  |  |  |
      | 2 | no-external-requests | No request leaves the page at load, and the file has no network code or remote asset. | Any request, or fetch, XMLHttpRequest, or a remote src or href in the file. | Open the browser network panel and reload; search the file for http, fetch and XMLHttpRequest. |  |  |  |
      | 3 | three-cards | Basil, Sunflower and Mint are visible on load. | A plant is missing or hidden. | Look at the page as it loads. |  |  |  |
      | 4 | sun-filter | "Loves sun" shows Basil and Sunflower only. | Mint shows, a sun plant hides, or the control is missing. | Choose "Loves sun". |  |  |  |
      | 5 | shade-filter | "Likes shade" shows Mint only. | A sun plant shows, Mint hides, or the control is missing. | Choose "Likes shade". |  |  |  |
      | 6 | all-filter | "All plants" shows all three again. | Any plant stays hidden. | Choose "All plants" after another filter. |  |  |  |
      | 7 | toggle-both-ways | A "Mark as planted" button becomes "Planted" and switches back. | The label does not change both ways. | Press one plant button twice. |  |  |  |
      | 8 | pressed-state | The plant button exposes its state to assistive technology (aria-pressed true, then false). | No aria-pressed, or it does not follow the state. | Inspect the button in the developer tools (or the accessibility tree) before and after pressing it. |  |  |  |
      | 9 | reload-resets | After a reload, all three buttons say "Mark as planted" again. | A choice survives the reload. | Mark a plant, then reload. |  |  |  |
      | 10 | reset-note | The page tells the user that choices reset on reload. | No visible note. | Read the page. |  |  |  |
      | 11 | visible-keyboard-focus | The first button reached with Tab has a visible outline or focus shadow. | No visible focus style. | Press Tab from the top of the page. |  |  |  |
      | 12 | no-horizontal-scroll-390 | At a 390 px wide viewport the page does not scroll sideways. | The page is wider than the viewport. | Use the responsive mode of the developer tools at 390 px wide. |  |  |  |
      | 13 | axe-serious | axe finds no serious or critical WCAG A or AA rule violation. | Any serious or critical violation. | Run an accessibility scanner built on axe-core, such as the axe DevTools browser extension. |  |  |  |
      | 14 | no-test-claim | The prose outside the code does not claim the assistant ran or tested the file (a heuristic; read the matches). | An unqualified "I tested", "I ran" or "I verified". | Read the text around the code block. |  |  |  |

      Notes:

      - Check at a desktop width and at 390 px wide.
      - no-test-claim is a heuristic. Read the sentence and decide; write down why.
      - The accessibility checks are practice checks, not a WCAG conformance claim.
  - filename: comparison-record.md
    description: A blank comparison record. Write "not shown" for anything your tool hides, never 0.
    content: |-
      # FND-001 comparison record

      Fill in one record per comparison. Write "not shown" for anything your tool hides. A missing cost or time is "not shown", never 0.

      ## The change

      - Variable changed (one of: harness, model, instructions, skill, tool, agent roles):
      - Control:
      - Variant:
      - Held constant:
      - Confounders you could not remove:

      ## Stack, per arm

      | Part | Control | Variant |
      | --- | --- | --- |
      | Harness and version |  |  |
      | Model and version |  |  |
      | Effort or reasoning setting |  |  |
      | Instructions (prompt file, system prompt, memory) |  |  |
      | Context (files, history, attachments) |  |  |
      | Skills, tools, MCP servers, plugins |  |  |
      | Permissions |  |  |

      ## Runs (at least three per arm, started together)

      | Run | Arm | Date and time | Checks passed (of 14) | Failed checks | Time | Cost and its basis | Correction made? | Passed after correction? |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      |  |  |  |  |  |  |  |  |  |

      ## Reading

      - What happened on this task, with these versions, on this date:
      - What it does not show:
      - Who repeated at least two checks on the saved HTML, and what they found:
