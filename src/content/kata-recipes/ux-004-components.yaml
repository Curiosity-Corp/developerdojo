# UX pathway (M9): a draft recipe. The worked example, its Penpot file and its checks are on /katas/ux-pathway.
# Evidence paths are site paths. Checks marked passed were run on the date given; not-run means nobody has run it yet.
status: draft
maintainer:
  role: UX pathway maintainer
trackingIssue: https://git.developerdojo.org/Curiosity-Corp/developerdojo/-/issues/91
review:
  unavailable: Built and checked by the Dojo maintainers; no independent review yet.
summary: Turn the repeated parts of your screens into components (buttons, fields, the error summary, the dialog) built from your tokens, so one change updates every screen.
metadata:
  id: UX-004
  title: Build components from tokens
  layer: specialization
  professionalReviewRequired: false
  outcomeIds:
    - build-components
  artifactTypes:
    - component-library
  domainIds:
    - ux
  capabilityIds:
    - design-systems
    - design-interaction
  foundationKataIds:
    - PRACTICE-001
    - PRACTICE-002
  stackRecipeIds:
    - penpot-and-browser
    - assistant-and-browser
  pathwayIds:
    - personas-and-journeys
    - brand-website-and-mockups
  constraintIds:
    - fictional-data
    - no-personal-data
    - no-paid-tools
  externalResources:
    - penpot/components
    - gov-uk/error-summary
  verificationEvidence:
    - description: The file has a main component for every repeated part, and the high-fidelity screens use them
      method: self-check
    - description: A partner changes one main component and confirms every copy updates
      method: peer-review
  beltCriteria:
    - stage: practice
      criterion: Finds the 8 main components on page 03 of the example and where each is used on page 04
    - stage: adapt
      criterion: Adds a disabled or loading state to the button component
    - stage: demonstrate
      criterion: Builds the components the Randori flow needs and uses them on every screen
  standards: []
showcase:
  summary: "The Dojo’s worked example, made by the maintainers rather than by a learner: Pocket Invoice as an editable Penpot file, a token file and a working, accessible page."
  href: /katas/ux-pathway
  provenance:
    creator: Developer Dojo maintainers
    source: Generated from the Pocket Invoice flow and tokens with Penpot’s official library
    license: MIT
    date: "2026-11-20"
brief:
  goal: A small component library in Penpot (buttons, fields with and without errors, an error summary, a summary list and a dialog) styled only with your tokens, and high-fidelity screens built from it.
  audience: Learners with a token file who want screens they can change in one place.
  inputs:
    - name: Your token file from UX-003
      source: Your own work
      terms: Your work
    - name: Error summary pattern
      source: gov-uk/error-summary
      terms: Open Government Licence v3.0; the Dojo credits the pattern and copies no text or code
  doneWhen:
    - Every repeated part is a main component with a clear name and path, such as Button/Primary
    - Components use library colours and typographies that match your tokens
    - The error summary sits above the heading and lists each error with the same words as the message by the field
    - The high-fidelity screens use copies of the components
stack:
  components:
    - part: tool
      name: Penpot (self-hosted or penpot.app)
      version: 2.18 (the example file was checked on a self-hosted 2.18.7)
      permissions: Edit one practice project of your own
      cost: "Penpot Professional plan: $0, up to 8 members and 10 GB, no file limits (penpot.app/pricing, checked 2026-11-20). Self-hosting is free under MPL-2.0; you pay for your own server."
    - part: harness
      name: Any chat assistant in a browser
      version:
        unavailable: Not fixed; any assistant can draft the text, and its version changes the wording, not the checks
      permissions: Reads only what you paste into it; it never touches the design file
      cost:
        unavailable: Depends on your assistant and plan; not measured
    - part: instructions
      name: The prompts on this page
      version: Draft, 2026-11-20
      permissions: None
      cost: None
    - part: data
      name: Pocket Invoice, an invented invoicing app
      version: "Flow spec of 2026-11-20: 11 states, 19 transitions"
      permissions: Fictional; no real company, person or customer
      cost: None
  rationale: Penpot is open source, runs in a browser, can be self-hosted and has a free plan with no file limits, so every learner can open the same editable file. The assistant only drafts text you check; the design work and the checks stay with you.
  alternatives:
    - name: Figma
      tradeoff: Widely used. The free Starter plan allows unlimited drafts but is limited elsewhere (for example 20 MCP tool calls a month); Professional seats cost $3 to $16 a month and there is no self-hosting (figma.com/pricing, checked 2026-11-20). The example file is Penpot-only and has not been tried in Figma.
      tested: false
    - name: Penpot MCP server with an agent
      tradeoff: "Lets an agent edit the open page directly, but uses a personal key with no permission scopes. Not run for this pathway: no native write by an agent was verified."
      tested: false
agents:
  roles:
    - role: Drafting assistant
      responsibility: Lists the repeated parts across your screens and proposes a component name and the states each needs.
      reviewGate: You compare every line with the flow and the done-when list before it goes into Penpot.
    - role: Reviewer
      responsibility: Checks each component against the tokens and the error summary pattern, and lists differences.
      dependsOn:
        - Drafting assistant
      reviewGate: A finding counts only when the reviewer can point to the board, layer or line it is about.
setup:
  steps:
    - "Open Penpot in a browser: sign up at penpot.app, or use your own self-hosted instance."
    - Download pocket-invoice.penpot from the UX pathway page and import it (Projects, then Import .penpot).
    - Open each of the four pages once in the workspace before you use View mode, so Penpot lays out the text.
  auth: Your own Penpot account. The chat assistant needs no access to Penpot.
  smokeTest:
    action: Open page 03 Tokens and components in the imported file.
    expected: Eight main components, 16 library colours and 5 typographies.
    result: passed
    evidence: /examples/ux-pathway/penpot-import-check.json (checks components, library-colours and library-typographies)
    date: "2026-11-20"
prompts:
  - id: find-components
    title: Find the components
    purpose: Finds what repeats before you build anything.
    text: |-
      Here are the elements of each of my screens (headings, fields, buttons, messages, tables, dialogs).
      List the parts that repeat, propose a component name for each in the form Group/Variant, and list the states each needs (for example, a field with and without an error).
      Do not propose components for parts that appear only once.
exercise:
  title: Error summary (GOV.UK Design System)
  resourceId: gov-uk/error-summary
  terms: Read on the publisher’s site. GOV.UK Design System guidance is published under the Open Government Licence v3.0 unless it says otherwise; the Dojo credits the pattern and copies no text or code.
execution:
  steps:
    - actor: Drafting assistant
      action: List the repeated parts and their states with the prompt.
      handoff: You check the list against your screens.
    - actor: Learner
      action: Build each main component from your library colours and typographies, then rebuild the screens from copies.
    - actor: Reviewer
      action: Change one main component and check that every copy follows; compare the error summary with the GOV.UK guidance.
      handoff: You fix differences.
verification:
  checks:
    - action: Count main components, library colours and typographies in the example file after import
      expected: 8 components, 16 colours, 5 typographies
      result: passed
      evidence: /examples/ux-pathway/penpot-import-check.json (checks components, library-colours and library-typographies)
      date: "2026-11-20"
    - action: Change a main component in your file and look at the screens
      expected: Every copy changes
      result: not-run
adaptation:
  variations:
    - change: Add a second language with longer words.
      effect: Buttons and fields must grow with their text; test with the longest label before you fix widths.
    - change: Share the library with another file.
      effect: Publish the file as a shared library in Penpot and check that a second file can use its components.
randori:
  challenge: See the UX Randori recipe.
  constraints:
    - Screens built only from components
  evaluation: One change to a main component updates every screen.
maintenance:
  cadence: Every six months, or when Penpot changes its file format or token import
  caveats:
    - "This recipe is a draft: the example was built and checked by the Dojo maintainers, and no learner has run it yet."
    - Penpot plans, versions and features change; check penpot.app/pricing and help.penpot.app before you rely on a limit.
    - The example file was checked on a self-hosted Penpot 2.18.7. Penpot cloud (penpot.app) was not checked.
