review:
  unavailable: Built and checked by the Dojo maintainers and CI; no independent review, and no review by a robotics safety engineer, controls engineer or robot integrator yet.
summary: "Reproduce the library’s IKinSpace and IKinBody examples, then find joint angles for two target poses of the UR5 by Newton-Raphson, from two different initial guesses for one of them, check every solution by the joint chain, and report a target beyond reach as no solution."
