showcase:
  summary: "The Dojo’s worked example, made by the maintainers rather than by a learner: the open UR5 description checked against the manufacturer’s DH table, the code checked against every value printed in the Modern Robotics code library’s worked examples, then poses by three methods and joint solutions checked by a fourth, all computed by the site’s CI. Simulation only, not a safety assessment."
  href: /katas/robotics-pathway
  provenance:
    creator: Universal Robots ROS 2 Description maintainers (UR5 kinematics file); Developer Dojo maintainers (configurations, targets, script and results)
    source: config/ur5/default_kinematics.yaml of the Universal Robots ROS 2 Description (BSD-3-Clause, commit 0eb1a861…070c, downloaded 2026-11-27); worked examples of the Modern Robotics code library and Universal Robots’ UR5 DH table, cited; results from /examples/robotics-pathway/tools/robotics_pathway.py
    license: UR5 kinematics file BSD-3-Clause, served unchanged with its licence; configurations, targets, script and outputs MIT
    date: "2026-11-27"
brief:
  goal: Joint angles for each reachable target, each checked by a method other than the one that found it, and an honest no for the target that cannot be reached.
  audience: Learners who finished ROB-002.
  inputs:
    - name: The UR5 kinematics file
      source: /examples/robotics-pathway/inputs/ur5-default-kinematics.yaml (unchanged)
      terms: BSD-3-Clause
    - name: Three target poses and four initial guesses
      source: /examples/robotics-pathway/scenario/targets.csv
      terms: Written by the Dojo, MIT licence
  doneWhen:
    - Your code reproduces the library’s two printed solutions
    - Your solutions match /examples/robotics-pathway/generated/ik.json and reach their targets when checked by the joint chain
    - The beyond-reach target is reported as no solution, never as the last guess
stack:
  components:
    - part: runtime
      name: Python, standard library only
      version: "3.12"
      permissions: Reads the files you give it and writes only the output folder you name
      cost: Free
    - part: tool
      name: Any text editor or spreadsheet
      version:
        unavailable: Not fixed; anything that opens YAML, CSV and JSON as text works
      permissions: Opens a copy of the files
      cost:
        unavailable: Depends on the editor you use; free ones work
    - part: data
      name: UR5 default kinematics of the Universal Robots ROS 2 Description
      version: "Commit 0eb1a861…070c, SHA-256 4559bd02…e9c3ac, downloaded 2026-11-27"
      permissions: Read a copy; keep its BSD-3-Clause licence with it
      cost: Free (BSD-3-Clause)
    - part: harness
      name: Any chat assistant or coding agent
      version:
        unavailable: Not fixed; an assistant may explain a formula or draft code, and every number it gives is checked against the published worked examples
      permissions: Reads what you paste in; paste only the open UR5 file and the Dojo’s configurations, never a real cell’s layout, a customer’s program or controller credentials
      cost:
        unavailable: Depends on your assistant and plan; not measured
  rationale: "Kinematics on six joints needs only small matrices, so the standard library (math) is enough: nothing to install, it runs offline, and it gives the same numbers on every machine. CI runs the identical script on every pipeline."
  alternatives:
    - name: The Modern Robotics library itself, with NumPy, or a ROS 2 stack with the URDF and tf2
      tradeoff: "Faster to write and closer to production, but the learner then checks a library against itself; writing the few functions here and reproducing the library’s printed examples is the point. Not run for this pathway, so no numbers from them are compared here."
      tested: false
agents:
  roles:
    - role: Explaining assistant
      responsibility: Explains Newton-Raphson inverse kinematics and the pseudoinverse, and drafts the solver.
      reviewGate: You keep its solver only if it reproduces the library’s printed solutions.
    - role: Learner as reviewer
      responsibility: Checks every solution by the joint chain and compares iterations and errors with the CI output.
      dependsOn:
        - Explaining assistant
      reviewGate: A solution stays only if the joint chain puts the arm on its target.
setup:
  steps:
    - Use the folder and Python from ROB-002.
    - Open the library’s IKinSpace docstring beside the script.
  auth: None. Nothing here needs an account.
  smokeTest:
    action: "Run: python3 -I tools/robotics_pathway.py . out"
    expected: "IKinSpace’s printed solution 1.57073783, 2.99966384, 3.1415342 reproduced; 3 of 4 solves find a solution; beyond-reach none after 20 steps"
    result: passed
    evidence: /examples/robotics-pathway/generated/ik.json, recomputed by CI on every pipeline
    date: "2026-11-27"
prompts:
  - id: explain-newton
    title: Explain the solver and its limits
    purpose: Know what a Newton-Raphson answer does and does not promise before you use one.
    text: |-
      I solve a six-joint arm’s inverse kinematics by Newton-Raphson: theta becomes theta + pinv(Js(theta)) Vs until the error twist is small.
      Explain why two initial guesses can give two different solutions for the same target, why a target out of reach makes the iteration fail rather than give a wrong answer, and what happens near a singularity. Then draft the solver in Python, standard library only, so I can check it against the Modern Robotics library’s printed IKinSpace example.
      If you are not sure, say so.
exercise:
  title: Modern Robotics code library, IKinSpace and IKinBody worked examples
  resourceId: modern-robotics/code-library
  terms: MIT licence; its printed numbers are used as checks, and its code is not copied.
execution:
  steps:
    - actor: Explaining assistant
      action: Drafts the solver.
      handoff: You run it on the library’s printed examples.
    - actor: Learner
      action: Solve each target from its guess, then check each solution with the joint chain from ROB-002.
    - actor: Learner
      action: Compare iterations, solutions and errors with the CI output, and explain the beyond-reach result.
verification:
  checks:
    - action: Solve the targets with the pathway script
      expected: "pick from near: 0.399987, -1.300089, 1.600003, -1.899947, -1.570851, 0.199920 in 2 steps; pick from elbow-other-way: 0.399987, 0.217418, -1.599960, -0.217429, -1.570789, 0.199966 in 3 steps; place in 3 steps; beyond-reach none, 1.208 m from the shoulder against a 1.103 m bound"
      result: passed
      evidence: /examples/robotics-pathway/generated/ik.json, recomputed by CI on every pipeline
      date: "2026-11-27"
    - action: Your own solver reproduces the same solutions
      expected: The same solutions and outcomes at the precision shown
      result: not-run
  failures:
    - observed: The beyond-reach target returns joint angles after 20 steps
      correction: Those are only the last guess. Report no solution, and say why if you can, as ik.json does.
    - observed: Only one pick solution is accepted as right
      correction: Both put the arm on the target; they differ in elbow configuration. Which one a cell uses is a planning and safety decision, not a kinematics one.
adaptation:
  variations:
    - change: Solve in the body frame instead of the space frame
      effect: The same targets are reached; the iterates and step counts can differ.
randori:
  challenge: See the robotics Randori recipe, ROB-R01.
  constraints:
    - Every solution is checked by the joint chain
  evaluation: The solutions match the CI output.
maintenance:
  cadence: Every six months, or when the Universal Robots ROS 2 Description changes the UR5 kinematics file or the Modern Robotics library changes a worked example
  caveats:
    - "This recipe is a draft: the example was built and checked by the Dojo maintainers and CI, and no learner has run it yet."
    - Simulation only. No real robot moved, and nothing here is a risk assessment, a safety function or a check against a robot safety standard. No robotics safety engineer, controls engineer or integrator has reviewed it.
    - Never send commands from this kata to a real robot, and never paste a real cell’s layout, program or controller credentials into an assistant.
