  id: ROB-002
  title: "Compute forward kinematics three ways and show they agree"
  layer: specialization
  professionalReviewRequired: true
  outcomeIds:
    - compute-forward-kinematics
  artifactTypes:
    - pose-table
  domainIds:
    - robotics
  capabilityIds:
    - inspect-model
