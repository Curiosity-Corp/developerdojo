    - name: REP 103, Standard Units of Measure and Coordinate Conventions
      version: "Status Active; created 2010-10-07, post-history 2014-12-31; read 2026-11-27"
      applicability: "Metres, radians and the fixed-axis roll, pitch and yaw in which the poses are reported"
      reviewScope: "What the listed checks test: that every pose is reported in REP 103 units and order."
