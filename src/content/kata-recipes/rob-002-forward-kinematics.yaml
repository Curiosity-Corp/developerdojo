    - name: Universal Robots ROS 2 Description, UR5 default kinematics
      version: "config/ur5/default_kinematics.yaml at commit 0eb1a861…070c (SHA-256 4559bd02…e9c3ac), downloaded 2026-11-27"
      applicability: "The nominal UR5 joint chain that the three methods are computed from"
