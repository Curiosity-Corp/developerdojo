  id: BIM-006
  title: Trace quantities to the model objects
  layer: specialization
  professionalReviewRequired: true
  outcomeIds:
    - trace-quantities
  artifactTypes:
    - quantity-table
  domainIds:
    - architecture-bim
    - construction
  capabilityIds:
    - take-off-quantities
    - verify-evidence
  foundationKataIds:
    - PRACTICE-001
    - PRACTICE-002
  stackRecipeIds:
    - ifcopenshell-and-python
  constraintIds:
    - licensed-sample-only
    - no-paid-tools
    - offline-capable
  externalResources:
    - buildingsmart/ifc-wall-example
    - ifcopenshell/geometry-processing
  crossFieldTransfers:
    - construction
  standards:
    - name: Industry Foundation Classes (IFC)
      version: IFC4 ADD2 TC1 (ISO 16739-1:2018), as declared by the sample file
      applicability: The buildingSMART practice sample and copies of it only
      reviewScope: "What the listed checks test: the shapes and attributes in the sample file. No claim about any real building."
  verificationEvidence:
    - description: A quantity table in which every row names its source entities, GlobalIds, unit, method and assumption, matching the Dojo's CI output
      method: automated-check
      standards:
        - Industry Foundation Classes (IFC)
    - description: Cross-checks in which the parametric and geometric routes agree for wall thickness, net volume and both net face areas
      method: automated-check
      standards:
        - Industry Foundation Classes (IFC)
