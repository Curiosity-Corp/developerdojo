  id: MFG-003
  title: "Split the variation into its sources, and see which sigma a capability index must use"
  layer: specialization
  professionalReviewRequired: true
  outcomeIds:
    - separate-variation-sources
  artifactTypes:
    - variance-components
  domainIds:
    - manufacturing
  capabilityIds:
    - analyze-data
    - calculate
    - verify-evidence
  foundationKataIds:
    - PRACTICE-001
    - PRACTICE-002
  stackRecipeIds:
    - python-standard-library
  constraintIds:
    - no-paid-tools
    - offline-capable
    - no-personal-data
  externalResources:
    - nist/handbook-process-monitoring-and-control
    - nist/handbook-lithography-case-study
    - nist/engineering-statistics-handbook
  crossFieldTransfers:
    - data
  standards:
    - name: NIST/SEMATECH e-Handbook of Statistical Methods, chapter 6 (Process or Product Monitoring and Control)
      version: "Web edition last updated 2022-04-27, DOI 10.18434/M32189; read 2026-11-25"
      applicability: "The nested analysis of variance and variance components of section 6.6.1.3 and the capability indices and rejects table of section 6.1.6, used on the handbook’s own case study and example for practice"
      reviewScope: "What the listed checks test: that the code reproduces the sums of squares, mean squares, variance components and capability values the handbook publishes. No claim that any real process is capable."
      sourceResourceId: nist/handbook-process-monitoring-and-control
  verificationEvidence:
    - description: The sums of squares, mean squares and three variance components of section 6.6.1.3 and the capability example and rejects table of section 6.1.6, as the CI output does
