  role: Manufacturing pathway maintainer
trackingIssue: https://git.developerdojo.org/Curiosity-Corp/developerdojo/-/issues/93
review:
  unavailable: Built and checked by the Dojo maintainers and CI; no independent review, and no review by a quality engineer, statistician or process engineer yet.
summary: "Reproduce the handbook’s nested analysis of variance for the lithography record, solve its expected mean squares for the cassette, wafer and site variance components, then reproduce the handbook’s capability example and see how far the within-wafer sigma would overstate capability."
