# Agriculture pathway (#93): a draft recipe. The worked example, files and CI results are on /katas/agriculture-pathway.
# Evidence paths are site paths. Checks marked passed were run on the date given and are recomputed by CI (job agriculture_pathway); not-run means nobody has run it yet.
status: draft
maintainer:
  role: Agriculture pathway maintainer
trackingIssue: https://git.developerdojo.org/Curiosity-Corp/developerdojo/-/issues/93
review:
  unavailable: Built and checked by the Dojo maintainers and CI; no independent, agronomic or engineering review yet.
summary: Start from the maize estimate; a partner reveals one changed assumption after you begin. Predict the direction and rough size of the change, then recompute and explain the difference.
metadata:
  id: AGR-R01
  title: "Agriculture Randori: an unseen change of assumption"
  layer: specialization
  professionalReviewRequired: true
  outcomeIds:
    - estimate-irrigation-need
  artifactTypes:
    - irrigation-estimate
  domainIds:
    - agriculture
  capabilityIds:
    - calculate
    - verify-evidence
  foundationKataIds:
    - PRACTICE-001
    - PRACTICE-002
  stackRecipeIds:
    - python-standard-library
  constraintIds:
    - no-paid-tools
    - offline-capable
    - no-personal-data
  externalResources:
    - noaa/ghcn-daily
    - fao/crop-evapotranspiration-56
    - fao/irrigation-water-needs
  crossFieldTransfers:
    - data
  verificationEvidence:
    - description: For the card drawn, a written prediction, the recomputed season need, and an explanation of any gap between them
      method: automated-check
    - description: A Sensei or partner checks that the prediction was written before the recompute and that the explanation names the equation that moved
      method: sensei-review
  beltCriteria:
    - stage: practice
      criterion: Handles card C, where the change is small, and explains why it is small
    - stage: adapt
      criterion: Handles card A or B and predicts the sign of the change correctly
    - stage: demonstrate
      criterion: Writes a fourth card for a partner and predicts its result before running it
showcase:
  summary: "The Dojo’s worked example, made by the maintainers rather than by a learner: one year of NOAA daily weather for a California station, FAO-56 reference evapotranspiration and a maize irrigation estimate, every number computed by the site’s CI."
  href: /katas/agriculture-pathway
  provenance:
    creator: NOAA National Centers for Environmental Information (weather record); Developer Dojo maintainers (script and results)
    source: NOAA GHCN-Daily station USW00093193, 2023; method from FAO Irrigation and Drainage Paper 56; results from /examples/agriculture-pathway/tools/agri_pathway.py
    license: Weather record is a US government work (no US copyright, 17 U.S.C. 105); script and outputs MIT
    date: "2026-11-21"
brief:
  goal: Meet one changed assumption you did not see in advance, with a prediction first and a recompute after.
  audience: Learners who finished AGR-003, working with a partner or Sensei.
  inputs:
    - name: Your AGR-003 estimate
      source: Your own output, or /examples/agriculture-pathway/generated/irrigation.json
      terms: Dojo output, MIT licence
    - name: The Randori cards
      source: The table on /katas/agriculture-pathway (the partner keeps it; the learner sees only the drawn card)
      terms: Dojo content, MIT licence
  doneWhen:
    - Your prediction (sign and rough size) is written before you recompute
    - Your recomputed season need matches /examples/agriculture-pathway/generated/randori/cards.json for the card
    - You name the equation or table value the card changed and explain any gap between prediction and result
stack:
  components:
    - part: runtime
      name: Python, standard library only
      version: "3.12"
      permissions: Reads the files you give it and writes only the output folder you name
      cost: Free
    - part: tool
      name: Any spreadsheet
      version:
        unavailable: Not fixed; any spreadsheet that opens CSV works
      permissions: Opens a copy of the CSV files
      cost:
        unavailable: Depends on the spreadsheet you use; free ones work
    - part: data
      name: NOAA GHCN-Daily record, station USW00093193
      version: "2023, SHA-256 abde4990…b3b9a7"
      permissions: Read a copy
      cost: Free (US government work)
    - part: harness
      name: Any chat assistant or coding agent
      version:
        unavailable: Not fixed; an assistant may explain an equation or draft code, and every number it gives is checked against FAO's worked examples
      permissions: Reads what you paste in; give it a copy of the record only
      cost:
        unavailable: Depends on your assistant and plan; not measured
  rationale: The standard library is enough for these equations, runs offline with nothing to install, and gives the same numbers on every machine. CI runs the identical script on every pipeline.
  alternatives:
    - name: A ready-made evapotranspiration package or FAO's ETo Calculator
      tradeoff: Faster, but hides the equations this pathway is about. Not tried for this pathway, so its numbers are not compared here.
      tested: false
agents:
  roles:
    - role: Partner or Sensei
      responsibility: Draws one card after the learner starts and keeps the others hidden.
      reviewGate: Asks for the prediction, the recompute and the explanation.
    - role: Learner
      responsibility: Reads the card, predicts, changes only the one assumption and recomputes.
      dependsOn:
        - Partner or Sensei
      reviewGate: The prediction is written down before the recompute runs.
setup:
  steps:
    - Use the folder and Python from AGR-003.
    - The partner opens the Randori table on /katas/agriculture-pathway; the learner does not.
  auth: None.
  smokeTest:
    action: Recompute all three cards with the pathway script
    expected: "Card A +22.5 mm, card B +26.9 mm, card C -2.4 mm against the 726.8 mm baseline"
    result: passed
    evidence: /examples/agriculture-pathway/generated/randori/cards.json, recomputed by CI on every pipeline
    date: "2026-11-21"
prompts:
  - id: predict-first
    title: Predict before you compute
    purpose: Make the learner commit to a reading of the method before the code answers.
    text: |-
      My maize irrigation estimate changes in one way: <paste the card>.
      Do not compute anything yet. Tell me which equation or table value this changes, whether the season need should go up or down, and roughly by how much, with your reasoning. Then I will recompute.
exercise:
  title: Crop evapotranspiration (FAO Irrigation and Drainage Paper 56)
  resourceId: fao/crop-evapotranspiration-56
  terms: © FAO. Free to read online; cite it and read FAO's terms before copying text or figures.
execution:
  steps:
    - actor: Partner or Sensei
      action: Waits until the learner has started, then reveals one card.
      handoff: The learner writes a prediction.
    - actor: Learner
      action: Changes only what the card says, recomputes the season and compares with the prediction.
    - actor: Partner or Sensei
      action: Reviews the prediction, the result and the explanation.
verification:
  checks:
    - action: Recompute the three cards with the pathway script
      expected: "A (Kc end 0.60): 749.3 mm, +22.5; B (dewpoint Tmin minus 2 degrees C): 753.7 mm, +26.9; C (planting 1 May): 724.4 mm, -2.4, harvest 2023-09-27"
      result: passed
      evidence: /examples/agriculture-pathway/generated/randori/cards.json
      date: "2026-11-21"
    - action: A learner meets a drawn card with a prediction written first
      expected: Prediction, recompute and explanation
      result: not-run
  failures:
    - observed: Card C was expected to lower the need a lot because the season moves later
      correction: The season also ends a month later, in September, so the hot months stay inside it; only the total over the shifted days changes.
adaptation:
  variations:
    - change: The partner draws two cards
      effect: Apply one at a time and recompute after each, so you know which change moved what.
randori:
  challenge: Meet one changed assumption you have not seen, revealed after you start, on the maize estimate.
  constraints:
    - Write your prediction before you compute
    - Change only what the card says
    - Name the equation or table value that moved
  evaluation: The recompute matches the CI result for the card, and the partner agrees the explanation names what moved.
maintenance:
  cadence: Every six months, or when FAO revises Paper 56
  caveats:
    - "This recipe is a draft: the example was built and checked by the Dojo maintainers and CI, and no learner has run it yet."
    - Nothing here is an irrigation recommendation. No agronomist, irrigation engineer or water authority has reviewed it, and real water use needs the qualified people and local rules that apply to it.
    - Humidity, radiation and wind are estimated from temperature, as FAO-56 describes for missing data. The results are estimates, not measurements.
    - NOAA says GHCN-Daily is not homogenized. One station and one year say nothing about a trend.
    - The cards are invented practice changes, not advice for any farm.
