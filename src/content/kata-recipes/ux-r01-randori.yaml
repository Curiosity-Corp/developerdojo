brief:
  goal: In one session, map and wire a flow you have not seen, then adapt it to one constraint a partner reveals after you start.
  audience: Learners who have done UX-001 to UX-004.
  inputs:
    - name: An unseen brief and a sealed constraint
      source: "The unseen round on /katas/ux-pathway (round U: the brief, the sealed card for the partner and the review rubric), or a card your partner picks from the list in the download"
      terms: Dojo content, MIT licence
    - name: Moderated usability testing
      source: gov-uk/moderated-usability-testing
      terms: Open Government Licence v3.0 unless it says otherwise
  doneWhen:
    - The sitemap has no unreachable state and no dead end
    - The prototype reaches every transition
    - The hidden constraint is met, and you can say what it changed
    - "The partner walk is written up: where they went, where they stopped"
stack:
  components:
    - part: tool
      name: Penpot (self-hosted or penpot.app)
      version: 2.19 (the example file was checked on a self-hosted 2.19.5)
      permissions: Edit one practice project of your own
      cost: "Penpot Professional plan: $0, up to 8 members and 10 GB, no file limits (penpot.app/pricing, checked 2026-11-28). Self-hosting is free under MPL-2.0; you pay for your own server."
    - part: harness
      name: Any chat assistant in a browser
      version:
        unavailable: Not fixed; any assistant can draft the text, and its version changes the wording, not the checks
      permissions: Reads only what you paste into it; it never touches the design file
      cost:
        unavailable: Depends on your assistant and plan; not measured
    - part: instructions
      name: The prompts on this page
      version: Draft, 2026-11-20
      permissions: None
      cost: None
    - part: data
      name: Pocket Invoice, an invented invoicing app
      version: "Flow spec of 2026-11-20: 11 states, 19 transitions"
      permissions: Fictional; no real company, person or customer
      cost: None
  rationale: Penpot is open source, runs in a browser, can be self-hosted and has a free plan with no file limits, so every learner can open the same editable file. The assistant only drafts text you check; the design work and the checks stay with you.
  alternatives:
    - name: Figma
      tradeoff: "Widely used. The free Starter plan allows unlimited drafts but is limited elsewhere (for example 20 MCP tool calls a month, and no writing to the canvas through MCP); Professional seats cost $3 to $16 a month and there is no self-hosting (figma.com/pricing and developers.figma.com, checked 2026-11-28). The example file is Penpot-only and has not been tried in Figma."
      tested: false
    - name: Penpot MCP server with an agent
      tradeoff: "Lets an agent edit the open page directly, through a plugin in your open Penpot tab, but signs in with a personal key that expires and whose documentation names no permission scopes (help.penpot.app, checked 2026-11-28). Not run for this pathway. A write through the Plugin API, which the MCP server builds on, was proven on a self-hosted Penpot 2.19.5 on 2026-11-28 (penpot-plugin-write-check.json); a Randori stays without an assistant either way."
      tested: false
agents:
  unavailable: A Randori is done without an assistant, so the learner shows their own judgement.
setup:
  steps:
    - Your partner picks one brief and one constraint from the download and keeps the constraint hidden.
    - Open an empty Penpot project.
  auth: Your own Penpot account.
  smokeTest:
    action: Your partner reads the brief aloud.
    expected: You can name the user, the job and the first screen.
    result: not-run
exercise:
  title: Moderated usability testing (GOV.UK Service Manual)
  resourceId: gov-uk/moderated-usability-testing
  terms: Read on the publisher’s site. GOV.UK guidance is published under the Open Government Licence v3.0 unless it says otherwise.
execution:
  steps:
    - actor: Partner
      action: Reads the brief aloud and keeps the constraint hidden.
    - actor: Learner
      action: Maps the sitemap, with errors and the way back.
      handoff: The partner reveals the constraint.
    - actor: Learner
      action: Changes the sitemap and draws low-fidelity screens that meet the constraint, then wires them.
    - actor: Partner
      action: Walks the prototype without help, as in a moderated test, and notes where they stopped.
verification:
  checks:
    - action: Run the review script of the unseen round on the maintainers' reference answer, which the site does not publish
      expected: The adapted flow passes both script rows (structure and the hidden constraint); the first sitemap passes the structure row and misses the card
      result: passed
      evidence: /examples/ux-pathway/generated/randori-unseen/rubric.md, with the review script run by the ux_pathway CI job on every pipeline
      date: "2026-11-28"
    - action: Partner walk of the prototype
      expected: No dead end; the constraint is met
      result: not-run
adaptation:
  variations:
    - change: Two constraints instead of one.
      effect: "Harder: they may conflict, and you must say which one wins and why."
randori:
  challenge: Map and wire an unseen flow, then adapt it to a constraint your partner reveals only after your first sitemap.
  constraints:
    - The constraint is unseen until the first sitemap is drawn
    - Fictional data only
    - Every error state has a way back
    - No assistant during the session
  evaluation: "The partner walks the prototype without help. Pass: no dead end, the constraint is met, and the learner can say what the constraint changed."
maintenance:
  cadence: Every six months, or when Penpot changes its file format or token import
  caveats:
    - "This recipe is a draft: the example was built and checked by the Dojo maintainers, and no learner has run it yet."
    - Penpot plans, versions and features change; check penpot.app/pricing and help.penpot.app before you rely on a limit.
    - The example file was checked on a self-hosted Penpot 2.19.5. Penpot cloud (penpot.app) was not checked.
downloads:
  - filename: randori-cards.md
    description: Briefs and hidden constraints for the partner. The learner should not read it first.
    content: |
      # UX Randori cards (for the partner)

      Pick one brief and one constraint. Read the brief aloud. Keep the constraint until the learner has drawn a first sitemap.

      ## Briefs
      1. A library app: a member reserves a book, is told when it is ready, and can cancel.
      2. A tool-lending shelf for neighbours: borrow a drill, return it, report it broken.
      3. A class trip form: a parent gives permission, pays, and can change their answer.

      Every brief below now has a worked answer on the pathway page. For a round nobody has answered, use the
      unseen round there (round U): its brief, its sealed card and its review rubric.

      ## Hidden constraints
      - Every screen must work with a keyboard only, and the order of focus must match the order of reading.
      - The user may lose their connection at any step; nothing they typed may be lost.
      - Half the users read English as a second language; no screen may have more than one action.
      - The user must be able to undo the last action for 30 seconds.
      - A second person (a parent, a manager) must approve before the action takes effect.
