  id: FIN-R01
  title: "Finance Randori: an unseen change of terms"
  layer: specialization
  professionalReviewRequired: true
  outcomeIds:
    - compute-apr
  artifactTypes:
    - apr-calculation
  domainIds:
    - finance
  capabilityIds:
    - calculate
    - verify-evidence
