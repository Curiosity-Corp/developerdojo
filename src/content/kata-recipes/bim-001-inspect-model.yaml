# BIM pathway (M10, #92): a draft recipe. The worked example, files and CI check results are on /katas/bim-pathway.
# Evidence paths are site paths. Checks marked passed were run on the date given and are recomputed by CI (job bim_pathway); not-run means nobody has run it yet.
status: draft
maintainer:
  role: BIM pathway maintainer
trackingIssue: https://git.developerdojo.org/Curiosity-Corp/developerdojo/-/issues/92
review:
  unavailable: Built and checked by the Dojo maintainers and CI; no independent or professional review yet.
summary: "Open a real IFC file with IfcOpenShell and write down what it declares: schema, units, the spatial tree, each element with its GlobalId, and how the opening and window are related to the wall."
metadata:
  id: BIM-001
  title: "Inspect an IFC model: schema, units, spatial tree and relationships"
  layer: specialization
  professionalReviewRequired: true
  outcomeIds:
    - read-model
  artifactTypes:
    - model-evidence
  domainIds:
    - architecture-bim
  capabilityIds:
    - inspect-model
    - verify-evidence
  foundationKataIds:
    - PRACTICE-001
    - PRACTICE-002
  stackRecipeIds:
    - ifcopenshell-and-python
  constraintIds:
    - licensed-sample-only
    - no-paid-tools
    - offline-capable
  externalResources:
    - buildingsmart/ifc-wall-example
    - ifcopenshell/validation
  crossFieldTransfers:
    - construction
  standards:
    - name: Industry Foundation Classes (IFC)
      version: IFC4 ADD2 TC1 (ISO 16739-1:2018), as declared by the sample file
      applicability: The buildingSMART practice sample and copies of it only
      reviewScope: "What the listed checks test: the schema the file declares, its entities and relationships. No claim about any real building."
  verificationEvidence:
    - description: An inspection record (schema, units, spatial tree, elements and relationships) that matches the Dojo's CI output for the same file
      method: automated-check
      standards:
        - Industry Foundation Classes (IFC)
    - description: Each claim in the record points to an entity number or GlobalId in the file
      method: self-check
  beltCriteria:
    - stage: practice
      criterion: Reproduces the inspection record for the sample and explains why the opening is not in the storey's contained elements
    - stage: adapt
      criterion: Inspects a different openly licensed IFC file and records its units and spatial tree
    - stage: demonstrate
      criterion: Explains to a reviewer which claims about a model an inspection can support and which it cannot
showcase:
  summary: "The Dojo’s worked example, made by the maintainers rather than by a learner: buildingSMART’s wall-with-opening-and-window sample, a practice IDS, an edited copy and every check result, computed by the site’s CI."
  href: /katas/bim-pathway
  provenance:
    creator: buildingSMART International (sample model); Developer Dojo maintainers (IDS, edit and checks)
    source: buildingSMART Certification-datasets, pinned commit 80d976a9b193a26a8e928c3e79bff67af1de68a8; checks from /examples/bim-pathway/tools/bim_pathway.py
    license: Sample model CC BY 4.0 (buildingSMART International); IDS files, script and outputs MIT
    date: "2026-11-21"
brief:
  goal: An inspection record of the sample IFC file, with every claim traced to an entity in the file.
  audience: Learners who have done the foundations and want to read a BIM model as data rather than as a picture.
  inputs:
    - name: wall-with-opening-and-window.ifc
      source: buildingsmart/ifc-wall-example (copy on /examples/bim-pathway/)
      terms: CC BY 4.0, buildingSMART International; credit the source when you share a copy
  doneWhen:
    - You name the schema (IFC4) and the length unit (millimetre), and say where in the file each is declared
    - You draw the spatial tree from project to storey and list what the storey contains
    - You show that the opening voids the wall and the window fills the opening, with the relationship entities
    - Your counts match /examples/bim-pathway/generated/original/inspection.json
stack:
  components:
    - part: tool
      name: IfcOpenShell
      version: 0.9.0.post1
      permissions: Reads the IFC copy you open; writes only the file your script saves
      cost: Free (LGPL-3.0-or-later)
    - part: tool
      name: IfcTester
      version: 0.9.0
      permissions: Reads the IDS file and the IFC copy; writes only the report you ask for
      cost: Free (LGPL-3.0-or-later)
    - part: runtime
      name: Python in a virtual environment
      version: "3.12"
      permissions: Runs on your own machine; network only to install the pinned packages
      cost: Free
    - part: data
      name: buildingSMART wall-with-opening-and-window sample (IFC4)
      version: "Certification-datasets commit 80d976a, SHA-256 73b0e45d…097832"
      permissions: Read a copy; the licence allows changes with credit
      cost: Free (CC BY 4.0)
    - part: harness
      name: Any chat assistant or coding agent
      version:
        unavailable: Not fixed; an assistant may draft a script or explain an entity, and every claim it makes is checked against the file
      permissions: Reads what you paste in; if it runs commands, give it only the copy of the model
      cost:
        unavailable: Depends on your assistant and plan; not measured
  rationale: IfcOpenShell and IfcTester are open source, run offline once installed and implement the buildingSMART IFC and IDS standards, so every learner can rerun the same checks on the same file and get the same output. CI runs the identical script on every pipeline.
  alternatives:
    - name: A desktop BIM authoring tool (for example Bonsai for Blender, or a commercial tool)
      tradeoff: Shows the model visually and edits it by hand, but results depend on the tool and its export settings. Not tried for this pathway.
      tested: false
    - name: A web IFC viewer
      tradeoff: Lets you look at the geometry in a browser without installing anything, but a viewer is not a validator. No viewer was checked for this pathway.
      tested: false
agents:
  roles:
    - role: Explaining assistant
      responsibility: Explains an IFC entity or relationship you paste in, and drafts the Python to list it.
      reviewGate: You run the code on the file and keep only what the output shows.
    - role: Learner as reviewer
      responsibility: Compares the record with the file and with the Dojo's CI output.
      dependsOn:
        - Explaining assistant
      reviewGate: A claim stays only if it cites an entity number or GlobalId.
setup:
  steps:
    - "Create a virtual environment with Python 3.12: python3.12 -m venv .venv"
    - "Install the pinned packages: .venv/bin/pip install --require-hashes -r /examples/bim-pathway/tools/requirements.txt, or pip install ifcopenshell==0.9.0.post1 ifctester==0.9.0"
    - Download the sample model and the practice IDS from /katas/bim-pathway into a new, empty folder. Work on copies; keep the original.
  auth: None. Nothing here needs an account.
  smokeTest:
    action: "Run: .venv/bin/python -I -c \"import ifcopenshell; print(ifcopenshell.open('wall-with-opening-and-window.ifc').schema)\""
    expected: IFC4
    result: passed
    evidence: /examples/bim-pathway/generated/original/inspection.json (schema)
    date: "2026-11-21"
prompts:
  - id: explain-relationship
    title: Explain a relationship entity
    purpose: Learn what an IfcRel entity connects, without trusting the explanation blindly.
    text: |-
      Here is one line from an IFC4 file: <paste one IFCREL... line>.
      Explain which two things it connects and in which direction, naming each attribute.
      Then give me three lines of IfcOpenShell Python that print the same relationship, so I can check you against the file.
      If you are not sure about an attribute name, say so.
exercise:
  title: IFC wall with opening and window sample
  resourceId: buildingsmart/ifc-wall-example
  terms: CC BY 4.0, buildingSMART International.
execution:
  steps:
    - actor: Learner
      action: Open the file in a text editor and find FILE_SCHEMA, the unit assignment and the project.
    - actor: Explaining assistant
      action: Drafts a script that prints the spatial tree and each element's container.
      handoff: You run it and compare the output with the file.
    - actor: Learner
      action: Write the inspection record and compare it with the CI output.
verification:
  checks:
    - action: Inspect the sample with the pathway script
      expected: IFC4, length unit millimetre, Project > Site > Building > Storey; the storey contains the wall (#45) and the window (#102); the opening (#80) voids the wall and the window fills it
      result: passed
      evidence: /examples/bim-pathway/generated/original/inspection.json, recomputed by CI on every pipeline
      date: "2026-11-21"
    - action: Your own inspection record matches the CI output
      expected: Same schema, units, tree, counts and relationships
      result: not-run
  failures:
    - observed: The opening has no container of its own in the storey's contained elements
      correction: That is correct. An opening belongs to the wall it voids (IfcRelVoidsElement); the script reports its container through the wall.
adaptation:
  variations:
    - change: Use another openly licensed IFC file
      effect: Record its licence first; bigger files have many more entities, so list counts by class before you read single elements.
randori:
  challenge: See the BIM Randori recipe, BIM-R01.
  constraints:
    - Every claim cites the file
  evaluation: The record matches the CI output for the same file.
maintenance:
  cadence: Every six months, when IfcOpenShell or IfcTester releases a new minor version, or when buildingSMART revises IFC or IDS
  caveats:
    - "This recipe is a draft: the example was built and checked by the Dojo maintainers and CI, and no learner has run it yet."
    - The sample is a three-element test file, not a building. Nothing learned from it is evidence about a real project.
    - No model, property value or check result here is professionally reviewed or approved. A real project needs the qualified people its contract and jurisdiction name.
    - Information (IDS), schema and geometry checks are separate outcomes. Passing one says nothing about the others, and there is no combined score.
    - The earlier kata Find the story in a building model (/katas/inspect-ifc) reads the same sample by hand; this recipe reads it with code.
