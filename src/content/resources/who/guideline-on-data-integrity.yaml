summary: "A WHO guideline from Technical Report Series No. 1033 on keeping data and records trustworthy in regulated work. It defines ALCOA+ and says records should be attributable, legible, contemporaneous, original, accurate, complete, consistent, enduring and available. It is written for medicines work. Use it to learn the ideas, not as a rule for your project."
