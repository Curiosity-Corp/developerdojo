summary: "A guide from Google's people-research team on what made some of its teams more effective than others. It names five things that mattered most, among them psychological safety, dependability and clear structure and goals, and it shows the survey questions the team used. Read it before you write expectations for a team, and note that it is research from one company, so treat it as a strong hint, not a law."
