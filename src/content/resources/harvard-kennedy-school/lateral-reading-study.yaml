summary: "An open-access research article (CC BY 4.0, published 23 February 2021) about teaching students to check an unfamiliar website by leaving it and reading what other sources say, as professional fact checkers do. It reports that after the course far more students left the site to check. The authors say they do not know if the gain lasts. Read it to see why you check a claim away from the page that makes it."
