summary: "The paper that introduced Action Chunking with Transformers (ACT). It names the problem of errors that compound over time in imitation learning, and reports 80 to 90 per cent success on six real-world tasks from about 10 minutes of demonstrations each. Those results are the authors' own, on their own hardware."
