summary: "A step-by-step guide to a pre-mortem: before a project starts, the team writes down what could go wrong and what must go right, votes on the biggest threats and leaves with actions that each have an owner and a deadline. It is a cheap way to find the questions nobody asked. Use it to draw out hidden assumptions, or to attack a decision before you make it."
