summary: "A short team exercise from the Atlassian Team Playbook for agreeing on the problem before anyone argues about solutions. The team answers four questions (who has the problem, what it is, why it matters, where it happens) and then writes one problem statement. Use it to test your own problem statement against a group. The page is clear that the goal is to define the problem, not to solve it."
