<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Pocket Garden: three states of one screen</title>
<desc id="desc">A learner starts on All plants, selects Loves sun to see Basil and Sunflower, then marks Basil as planted. All plants restores the list and the plant button toggles back.</desc>
<rect width="1200" height="480" fill="#f5f5ef"/>
<g fill="#fff" stroke="#355847" stroke-width="4"><rect x="25" y="42" width="330" height="390" rx="20"/><rect x="435" y="42" width="330" height="390" rx="20"/><rect x="845" y="42" width="330" height="390" rx="20"/></g>
<g fill="#183429" font-family="system-ui,sans-serif"><text x="48" y="85" font-size="24" font-weight="700">1. ALL PLANTS</text><text x="458" y="85" font-size="24" font-weight="700">2. LOVES SUN</text><text x="868" y="85" font-size="24" font-weight="700">3. PLANTED</text></g>
<g fill="none" stroke="#89998e" stroke-width="3"><rect x="48" y="112" width="284" height="40" rx="10"/><rect x="48" y="178" width="284" height="58" rx="10"/><rect x="48" y="249" width="284" height="58" rx="10"/><rect x="48" y="320" width="284" height="58" rx="10"/><rect x="458" y="112" width="284" height="40" rx="10"/><rect x="458" y="178" width="284" height="58" rx="10"/><rect x="458" y="249" width="284" height="58" rx="10"/><rect x="868" y="112" width="284" height="40" rx="10"/><rect x="868" y="178" width="284" height="58" rx="10"/><rect x="868" y="249" width="284" height="58" rx="10"/></g>
<g fill="#183429" font-family="system-ui,sans-serif" font-size="19"><text x="64" y="139">All · Sun · Shade</text><text x="64" y="214">Basil · Mark as planted</text><text x="64" y="285">Mint · Mark as planted</text><text x="64" y="356">Sunflower · Mark as planted</text><text x="474" y="139">All · Sun selected · Shade</text><text x="474" y="214">Basil · Mark as planted</text><text x="474" y="285">Sunflower · Mark as planted</text><text x="884" y="139">All · Sun selected · Shade</text><text x="884" y="214">Basil · Planted ✓</text><text x="884" y="285">Sunflower · Mark as planted</text></g>
<g fill="none" stroke="#aa481c" stroke-width="5"><path d="M367 235h52m-12-12 12 12-12 12"/><path d="M777 235h52m-12-12 12 12-12 12"/></g>
<g fill="#385649" font-family="system-ui,sans-serif" font-size="17"><text x="462" y="356">All restores the complete list.</text><text x="870" y="356">Tap again to undo. Reload resets.</text></g>
</svg>
