<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Invoices: none yet (invoices-empty), low fidelity, 390 px</title>
<desc id="desc">The empty state explains what the screen is for and offers the one next step. Numbered circles are the transition numbers on the sitemap.</desc>
<rect x="0" y="0" width="390" height="844" fill="#ffffff"/>
<rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Pocket Invoice</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Empty state</text>
<text x="24" y="111" font-size="24" font-weight="700" fill="#212121">Invoices</text>
<text x="24" y="149" font-size="16" fill="#424242">You have not sent an invoice yet. Your</text>
<text x="24" y="173" font-size="16" fill="#424242">first one takes about two minutes.</text>
<g data-to="invoice-new" data-transition="6"><rect x="24" y="196" width="273" height="48" rx="4" fill="#424242"/><text x="160" y="226" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Create your first invoice</text><circle cx="317" cy="220" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="317" y="224" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">6</text></g>
<rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/>
</svg>
