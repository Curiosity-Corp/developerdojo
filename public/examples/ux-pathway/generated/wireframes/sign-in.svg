<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Sign in (sign-in), low fidelity, 390 px</title>
<desc id="desc">A branch the example does not build. It says so and offers the way back, so the user is never stranded. Numbered circles are the transition numbers on the sitemap.</desc>
<rect x="0" y="0" width="390" height="844" fill="#ffffff"/>
<rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Pocket Invoice</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Outside this flow</text>
<text x="24" y="111" font-size="24" font-weight="700" fill="#212121">Sign in</text>
<text x="24" y="149" font-size="16" fill="#424242">Signing in is not part of this practice</text>
<text x="24" y="173" font-size="16" fill="#424242">example. Nothing you typed has been sent</text>
<text x="24" y="197" font-size="16" fill="#424242">anywhere.</text>
<g data-to="signup" data-transition="5"><rect x="24" y="220" width="282" height="48" rx="4" fill="#e0e0e0" stroke="#616161" stroke-width="2"/><text x="165" y="250" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Back to create a workspace</text><circle cx="326" cy="244" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="326" y="248" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">5</text></g>
<rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/>
</svg>
