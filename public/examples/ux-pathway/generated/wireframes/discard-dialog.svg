<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Discard this invoice? (discard-dialog), low fidelity, 390 px</title>
<desc id="desc">A confirmation over the form, so a slip of the finger does not throw work away. Numbered circles are the transition numbers on the sitemap.</desc>
<rect x="0" y="0" width="390" height="844" fill="#ffffff"/>
<rect x="0" y="56" width="390" height="788" fill="#bdbdbd"/>
<text x="24" y="96" font-size="14" fill="#212121">The screen underneath stays in place</text>
<rect x="24" y="168" width="342" height="236" rx="8" fill="#ffffff" stroke="#212121" stroke-width="2"/>
<rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Pocket Invoice</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Dialog</text>
<text x="48" y="215" font-size="24" font-weight="700" fill="#212121">Discard this invoice?</text>
<text x="48" y="253" font-size="16" fill="#424242">What you entered will be lost.</text>
<g data-to="invoice-new" data-transition="12"><rect x="48" y="276" width="156" height="48" rx="4" fill="#424242"/><text x="126" y="306" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Keep editing</text><circle cx="224" cy="300" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="224" y="304" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">12</text></g>
<g data-to="invoices-empty" data-transition="13"><rect x="48" y="340" width="111" height="48" rx="4" fill="#e0e0e0" stroke="#616161" stroke-width="2"/><text x="103" y="370" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Discard</text><circle cx="179" cy="364" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="179" y="368" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">13</text></g>
<rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/>
</svg>
