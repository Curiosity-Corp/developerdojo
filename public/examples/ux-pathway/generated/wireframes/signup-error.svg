<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Create your workspace: fix two problems (signup-error), low fidelity, 390 px</title>
<desc id="desc">Shows every problem at once, names how to fix each, and keeps what the user typed. Numbered circles are the transition numbers on the sitemap.</desc>
<rect x="0" y="0" width="390" height="844" fill="#ffffff"/>
<rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Pocket Invoice</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Error</text>
<rect x="26" y="90" width="338" height="140" fill="#ffffff" stroke="#212121" stroke-width="4"/>
<text x="44" y="126" font-size="19" font-weight="700" fill="#212121">There is a problem</text>
<text x="44" y="157" font-size="16" fill="#212121" text-decoration="underline">Enter an email address in the correct</text>
<text x="44" y="181" font-size="16" fill="#212121" text-decoration="underline">format, like name@example.com</text>
<text x="44" y="209" font-size="16" fill="#212121" text-decoration="underline">Enter a workspace name</text>
<text x="24" y="279" font-size="24" font-weight="700" fill="#212121">Create your workspace</text>
<text x="40" y="317" font-size="16" font-weight="700" fill="#212121">Email address</text>
<text x="40" y="343" font-size="14" fill="#616161">We send your invoices from this address.</text>
<text x="40" y="369" font-size="16" font-weight="700" fill="#212121">Error: Enter an email address in the</text>
<text x="40" y="393" font-size="16" font-weight="700" fill="#212121">correct format, like name@example.com</text>
<rect x="40" y="404" width="326" height="48" fill="#ffffff" stroke="#212121" stroke-width="4"/>
<text x="52" y="434" font-size="16" fill="#424242">sam@example</text>
<rect x="24" y="300" width="4" height="152" fill="#212121"/>
<text x="40" y="493" font-size="16" font-weight="700" fill="#212121">Workspace name</text>
<text x="40" y="521" font-size="16" font-weight="700" fill="#212121">Error: Enter a workspace name</text>
<rect x="40" y="532" width="326" height="48" fill="#ffffff" stroke="#212121" stroke-width="4"/>
<rect x="24" y="476" width="4" height="104" fill="#212121"/>
<g data-to="invoices-empty" data-transition="3"><rect x="24" y="604" width="192" height="48" rx="4" fill="#424242"/><text x="120" y="634" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Create workspace</text><circle cx="236" cy="628" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="236" y="632" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">3</text></g>
<rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/>
</svg>
