<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Invoice INV-0001 sent (invoice-sent), low fidelity, 390 px</title>
<desc id="desc">Confirms the outcome in words, with the number to quote, and the way back to the list. Numbered circles are the transition numbers on the sitemap.</desc>
<rect x="0" y="0" width="390" height="844" fill="#ffffff"/>
<rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Pocket Invoice</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Success</text>
<text x="24" y="111" font-size="24" font-weight="700" fill="#212121">Invoice INV-0001 sent</text>
<text x="24" y="149" font-size="16" fill="#424242">Harbour Bakery will get it at</text>
<text x="24" y="173" font-size="16" fill="#424242">accounts@harbour-bakery.example. It is due</text>
<text x="24" y="197" font-size="16" fill="#424242">in 30 days.</text>
<g data-to="invoices-list" data-transition="18"><rect x="24" y="220" width="192" height="48" rx="4" fill="#424242"/><text x="120" y="250" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Back to invoices</text><circle cx="236" cy="244" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="236" y="248" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">18</text></g>
<rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/>
</svg>
