<svg xmlns="http://www.w3.org/2000/svg" width="1264" height="2206" viewBox="0 0 1264 2206" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Pocket Invoice components, drawn from the design tokens</title>
<desc id="desc">Every component of the high-fidelity screens with a sample: AppBar, Heading/Page, Heading/Section, Text/Body, Button/Primary, Button/Secondary, Button/Link, Field/Default, Field/Error, ErrorSummary, SummaryList, Table, Dialog.</desc>
<rect x="0" y="0" width="1264" height="2206" fill="#f5f7fa"/>
<text x="48" y="81" font-size="32" font-weight="700" fill="#101828" data-fit="48 1216">Pocket Invoice: components</text>
<text x="48" y="118" font-size="16" fill="#344054" data-fit="48 1216">Every component is drawn only with token values, by the same functions that draw the high-fidelity screens. Change a token or a</text>
<text x="48" y="142" font-size="16" fill="#344054" data-fit="48 1216">component, rerun the script, and every screen follows.</text>
<g data-sample="AppBar"><text x="48" y="201" font-size="19" font-weight="700" fill="#101828" data-fit="48 608">AppBar</text><text x="48" y="226" font-size="16" fill="#344054" data-fit="48 608">The bar at the top: the wordmark, and on a desktop the link to</text><text x="48" y="250" font-size="16" fill="#344054" data-fit="48 608">Invoices once signed in.</text><g data-component="AppBar"><rect x="48" y="272" width="560" height="64" fill="#ffffff"/><rect x="48" y="335" width="560" height="1" fill="#d0d5dd"/><rect x="80" y="288" width="32" height="32" rx="8" fill="#175cd3"/><text x="96" y="311" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="80 112">P</text><text x="124" y="311" font-size="19" font-weight="700" fill="#101828" data-fit="124 584">Pocket Invoice</text><text x="576" y="310" font-size="16" fill="#175cd3" text-anchor="end" text-decoration="underline" data-fit="488 576">Invoices</text></g></g>
<g data-sample="Heading/Page"><text x="656" y="201" font-size="19" font-weight="700" fill="#101828" data-fit="656 1216">Heading/Page</text><text x="656" y="226" font-size="16" fill="#344054" data-fit="656 1216">One per screen: font.size.xl on a desktop, font.size.l on a</text><text x="656" y="250" font-size="16" fill="#344054" data-fit="656 1216">phone and in a dialog.</text><g data-component="Heading/Page" data-element="0"><text x="656" y="305" font-size="32" font-weight="700" fill="#101828" data-fit="656 1216">Create your workspace</text></g></g>
<g data-sample="Heading/Section"><text x="656" y="401" font-size="19" font-weight="700" fill="#101828" data-fit="656 1216">Heading/Section</text><text x="656" y="426" font-size="16" fill="#344054" data-fit="656 1216">A smaller heading inside a screen.</text><g data-component="Heading/Section"><text x="656" y="469" font-size="19" font-weight="700" fill="#101828" data-fit="656 1216">Invoice details</text></g></g>
<g data-sample="Text/Body"><text x="48" y="405" font-size="19" font-weight="700" fill="#101828" data-fit="48 608">Text/Body</text><text x="48" y="430" font-size="16" fill="#344054" data-fit="48 608">Explanations under a heading, in the muted text colour.</text><g data-component="Text/Body" data-element="0"><text x="48" y="470" font-size="16" fill="#344054" data-fit="48 608">Signing in is not part of this practice example. Nothing you</text><text x="48" y="494" font-size="16" fill="#344054" data-fit="48 608">typed has been sent anywhere.</text></g></g>
<g data-sample="Button/Primary"><text x="656" y="545" font-size="19" font-weight="700" fill="#101828" data-fit="656 1216">Button/Primary</text><text x="656" y="570" font-size="16" fill="#344054" data-fit="656 1216">The one main action on a screen. Full width on a phone, as</text><text x="656" y="594" font-size="16" fill="#344054" data-fit="656 1216">wide as its label on a desktop.</text><g data-component="Button/Primary" data-element="0" data-to="invoices-empty"><rect x="656" y="616" width="207" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="759.5" y="646" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="656 863">Create workspace</text></g><text x="656" y="706" font-size="16" fill="#344054" data-fit="656 1216">Focused: a ring in color.focus.ring, border-width.thick,</text><text x="656" y="730" font-size="16" fill="#344054" data-fit="656 1216">outside the button</text><rect x="657" y="745" width="213" height="54" rx="8" fill="none" stroke="#194185" stroke-width="2"/><g data-component="Button/Primary" data-state="focus" data-element="0" data-to="invoices-empty"><rect x="660" y="748" width="207" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="763.5" y="778" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="660 867">Create workspace</text></g></g>
<g data-sample="Button/Secondary"><text x="48" y="593" font-size="19" font-weight="700" fill="#101828" data-fit="48 608">Button/Secondary</text><text x="48" y="618" font-size="16" fill="#344054" data-fit="48 608">Any other action, such as Change details or Discard.</text><g data-component="Button/Secondary" data-element="0" data-to="signup"><rect x="48" y="640" width="306" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="201" y="670" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="48 354">Back to create a workspace</text></g></g>
<g data-sample="Button/Link"><text x="48" y="781" font-size="19" font-weight="700" fill="#101828" data-fit="48 608">Button/Link</text><text x="48" y="806" font-size="16" fill="#344054" data-fit="48 608">A way to another part of the app that is not an action, such</text><text x="48" y="830" font-size="16" fill="#344054" data-fit="48 608">as I already have an account.</text><g data-component="Button/Link" data-element="0" data-to="sign-in"><text x="48" y="870" font-size="16" fill="#175cd3" text-decoration="underline" data-fit="48 608">I already have an account</text></g></g>
<g data-sample="Field/Default"><text x="656" y="869" font-size="19" font-weight="700" fill="#101828" data-fit="656 1216">Field/Default</text><text x="656" y="894" font-size="16" fill="#344054" data-fit="656 1216">A label, an optional hint and a text input at least</text><text x="656" y="918" font-size="16" fill="#344054" data-fit="656 1216">size.control tall.</text><g data-component="Field/Default" data-element="0"><text x="656" y="958" font-size="16" font-weight="700" fill="#101828" data-fit="656 1216">Email address</text><text x="656" y="982" font-size="16" fill="#344054" data-fit="656 1216">We send your invoices from this address.</text><rect x="656" y="992" width="560" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="668" y="1022" font-size="16" fill="#101828" data-fit="668 1204">sam@example.com</text></g></g>
<g data-sample="Field/Error"><text x="48" y="961" font-size="19" font-weight="700" fill="#101828" data-fit="48 608">Field/Error</text><text x="48" y="986" font-size="16" fill="#344054" data-fit="48 608">The same field with a bar, the word Error and a message that</text><text x="48" y="1010" font-size="16" fill="#344054" data-fit="48 608">names the fix: never colour alone.</text><g data-component="Field/Error" data-element="0"><rect x="48" y="1032" width="5" height="148" fill="#b42318"/><text x="65" y="1050" font-size="16" font-weight="700" fill="#101828" data-fit="65 608">Email address</text><text x="65" y="1074" font-size="16" fill="#344054" data-fit="65 608">We send your invoices from this address.</text><text x="65" y="1098" font-size="16" font-weight="700" fill="#b42318" data-fit="65 608">Error: Enter an email address in the correct format,</text><text x="65" y="1122" font-size="16" font-weight="700" fill="#b42318" data-fit="65 608">like name@example.com</text><rect x="65" y="1132" width="543" height="48" rx="4" fill="#ffffff" stroke="#b42318" stroke-width="2" data-control="input"/><text x="77" y="1162" font-size="16" fill="#101828" data-fit="77 596">sam@example</text></g></g>
<g data-sample="ErrorSummary"><text x="656" y="1133" font-size="19" font-weight="700" fill="#101828" data-fit="656 1216">ErrorSummary</text><text x="656" y="1158" font-size="16" fill="#344054" data-fit="656 1216">Above the heading after a failed submit: lists every problem,</text><text x="656" y="1182" font-size="16" fill="#344054" data-fit="656 1216">each linked to its field. Pattern credited to the GOV.UK</text><text x="656" y="1206" font-size="16" fill="#344054" data-fit="656 1216">Design System.</text><g data-component="ErrorSummary" data-element="0"><rect x="658.5" y="1230.5" width="555" height="153" fill="#ffffff" stroke="#b42318" stroke-width="5"/><text x="677" y="1270" font-size="19" font-weight="700" fill="#101828" data-fit="677 1195">There is a problem</text><text x="677" y="1303" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="677 1195">Enter an email address in the correct format, like</text><text x="677" y="1327" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="677 1195">name@example.com</text><text x="677" y="1359" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="677 1195">Enter a workspace name</text></g></g>
<g data-sample="SummaryList"><text x="48" y="1273" font-size="19" font-weight="700" fill="#101828" data-fit="48 608">SummaryList</text><text x="48" y="1298" font-size="16" fill="#344054" data-fit="48 608">Key and value rows to check before sending: two columns on a</text><text x="48" y="1322" font-size="16" fill="#344054" data-fit="48 608">desktop, stacked on a phone.</text><g data-component="SummaryList" data-element="0" data-variant="columns"><text x="48" y="1374" font-size="16" font-weight="700" fill="#101828" data-fit="48 228">Client</text><text x="244" y="1374" font-size="16" fill="#101828" data-fit="244 608">Harbour Bakery</text><rect x="48" y="1392" width="560" height="1" fill="#d0d5dd"/><text x="48" y="1423" font-size="16" font-weight="700" fill="#101828" data-fit="48 228">Send to</text><text x="244" y="1423" font-size="16" fill="#101828" data-fit="244 608">accounts@harbour-bakery.example</text><rect x="48" y="1441" width="560" height="1" fill="#d0d5dd"/><text x="48" y="1472" font-size="16" font-weight="700" fill="#101828" data-fit="48 228">Work</text><text x="244" y="1472" font-size="16" fill="#101828" data-fit="244 608">Menu redesign, two rounds of changes</text><rect x="48" y="1490" width="560" height="1" fill="#d0d5dd"/></g><text x="48" y="1525" font-size="16" fill="#344054" data-fit="48 608">On a phone: stacked</text><g data-component="SummaryList" data-element="0" data-variant="stacked"><text x="48" y="1569" font-size="16" font-weight="700" fill="#101828" data-fit="48 390">Client</text><text x="48" y="1593" font-size="16" fill="#101828" data-fit="48 390">Harbour Bakery</text><rect x="48" y="1611" width="342" height="1" fill="#d0d5dd"/><text x="48" y="1642" font-size="16" font-weight="700" fill="#101828" data-fit="48 390">Send to</text><text x="48" y="1666" font-size="16" fill="#101828" data-fit="48 390">accounts@harbour-bakery.example</text><rect x="48" y="1684" width="342" height="1" fill="#d0d5dd"/><text x="48" y="1715" font-size="16" font-weight="700" fill="#101828" data-fit="48 390">Work</text><text x="48" y="1739" font-size="16" fill="#101828" data-fit="48 390">Menu redesign, two rounds of changes</text><rect x="48" y="1757" width="342" height="1" fill="#d0d5dd"/></g></g>
<g data-sample="Table"><text x="656" y="1479" font-size="19" font-weight="700" fill="#101828" data-fit="656 1216">Table</text><text x="656" y="1504" font-size="16" fill="#344054" data-fit="656 1216">A table on a desktop. On a phone each row becomes a stacked</text><text x="656" y="1528" font-size="16" fill="#344054" data-fit="656 1216">block, so nothing scrolls sideways.</text><g data-component="Table" data-element="0" data-variant="table"><text x="656" y="1576" font-size="16" font-weight="700" fill="#101828" data-fit="656 788">Number</text><text x="796" y="1576" font-size="16" font-weight="700" fill="#101828" data-fit="796 928">Client</text><text x="936" y="1576" font-size="16" font-weight="700" fill="#101828" data-fit="936 1068">Amount</text><text x="1076" y="1576" font-size="16" font-weight="700" fill="#101828" data-fit="1076 1208">Status</text><rect x="656" y="1590" width="560" height="2" fill="#101828"/><text x="656" y="1622" font-size="16" fill="#101828" data-fit="656 788">INV-0001</text><text x="796" y="1622" font-size="16" fill="#101828" data-fit="796 928">Harbour Bakery</text><text x="936" y="1622" font-size="16" fill="#101828" data-fit="936 1068">$480.00</text><text x="1076" y="1622" font-size="16" fill="#101828" data-fit="1076 1208">Sent</text><rect x="656" y="1640" width="560" height="1" fill="#d0d5dd"/></g><text x="656" y="1675" font-size="16" fill="#344054" data-fit="656 1216">On a phone: each row stacked</text><g data-component="Table" data-element="0" data-variant="stacked"><rect x="656" y="1689" width="342" height="2" fill="#101828"/><text x="656" y="1721" font-size="16" font-weight="700" fill="#101828" data-fit="656 776">Number</text><text x="784" y="1721" font-size="16" fill="#101828" data-fit="784 998">INV-0001</text><text x="656" y="1749" font-size="16" font-weight="700" fill="#101828" data-fit="656 776">Client</text><text x="784" y="1749" font-size="16" fill="#101828" data-fit="784 998">Harbour Bakery</text><text x="656" y="1777" font-size="16" font-weight="700" fill="#101828" data-fit="656 776">Amount</text><text x="784" y="1777" font-size="16" fill="#101828" data-fit="784 998">$480.00</text><text x="656" y="1805" font-size="16" font-weight="700" fill="#101828" data-fit="656 776">Status</text><text x="784" y="1805" font-size="16" fill="#101828" data-fit="784 998">Sent</text><rect x="656" y="1823" width="342" height="1" fill="#d0d5dd"/></g></g>
<g data-sample="Dialog"><text x="48" y="1827" font-size="19" font-weight="700" fill="#101828" data-fit="48 608">Dialog</text><text x="48" y="1852" font-size="16" fill="#344054" data-fit="48 608">A question over the screen: an opaque scrim in the muted text</text><text x="48" y="1876" font-size="16" fill="#344054" data-fit="48 608">colour, and a card with the question and two buttons.</text><rect x="48" y="1898" width="560" height="260" fill="#344054"/><g data-component="Dialog"><rect x="80" y="1930" width="496" height="196" rx="8" fill="#ffffff"/><g data-component="Heading/Page" data-element="0"><text x="104" y="1980" font-size="24" font-weight="700" fill="#101828" data-fit="104 552">Discard this invoice?</text></g><g data-component="Text/Body" data-element="1"><text x="104" y="2024" font-size="16" fill="#344054" data-fit="104 552">What you entered will be lost.</text></g><g data-component="Button/Primary" data-element="2" data-to="invoice-new"><rect x="104" y="2054" width="168" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="188" y="2084" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="104 272">Keep editing</text></g><g data-component="Button/Secondary" data-element="3" data-to="invoices-empty"><rect x="288" y="2054" width="118" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="347" y="2084" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="288 406">Discard</text></g></g></g>
</svg>
