<path d="M993 776 H1043 V291 H993" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="7"><title>7. report to borrowed: Back to my loan</title></path>
