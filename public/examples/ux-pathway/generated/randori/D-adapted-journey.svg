<svg xmlns="http://www.w3.org/2000/svg" width="1129" height="2236" viewBox="0 0 1129 2236" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Tool shelf journey: every low-fidelity screen on one canvas, connected by its 9 transitions</title>
<desc id="desc">The 6 low-fidelity screens, one column per screen of the sitemap. Each line starts at the button or prototype-only link that causes it and carries the same number as on the sitemap.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#212121"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#616161"/></marker></defs>
<rect x="0" y="0" width="1129" height="2236" fill="#ffffff"/>
<text x="233" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Shelf</text>
<text x="564" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Tool</text>
<text x="895" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">My loan</text>
<g data-state="shelf"><text x="136" y="84" font-size="14" font-weight="700" fill="#212121">Tools on the shelf</text><g transform="translate(136 96) scale(0.5)"><rect x="0" y="0" width="390" height="844" fill="#ffffff"/><rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Tool shelf</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Screen</text>
<text x="24" y="111" font-size="24" font-weight="700" fill="#212121">Tools on the shelf</text>
<text x="24" y="149" font-size="16" fill="#424242">Borrow a tool for up to 7 days.</text>
<g data-to="tool" data-transition="1"><text x="24" y="189" font-size="16" fill="#212121" text-decoration="underline">Drill</text><circle cx="84" cy="184" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="84" y="188" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">1</text></g><rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/></g></g>
<g data-state="tool"><text x="467" y="84" font-size="14" font-weight="700" fill="#212121">Drill</text><g transform="translate(467 96) scale(0.5)"><rect x="0" y="0" width="390" height="844" fill="#ffffff"/><rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Tool shelf</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Screen</text>
<text x="24" y="111" font-size="24" font-weight="700" fill="#212121">Drill</text>
<text x="24" y="149" font-size="16" fill="#424242">Free to borrow. Bring it back within 7</text>
<text x="24" y="173" font-size="16" fill="#424242">days.</text>
<text x="24" y="213" font-size="16" font-weight="700" fill="#212121">Return by</text>
<rect x="24" y="224" width="342" height="48" fill="#ffffff" stroke="#616161" stroke-width="2"/>
<text x="36" y="254" font-size="16" fill="#424242">Friday</text>
<g data-to="borrowed" data-transition="2"><rect x="24" y="296" width="102" height="48" rx="4" fill="#424242"/><text x="75" y="326" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Borrow</text><circle cx="146" cy="320" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="146" y="324" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">2</text></g>
<g data-to="shelf" data-transition="3"><text x="24" y="377" font-size="16" fill="#212121" text-decoration="underline">Back to the shelf</text><circle cx="180" cy="372" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="180" y="376" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">3</text></g><rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/></g></g>
<g data-state="borrowed"><text x="798" y="84" font-size="14" font-weight="700" fill="#212121">You have the drill</text><g transform="translate(798 96) scale(0.5)"><rect x="0" y="0" width="390" height="844" fill="#ffffff"/><rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Tool shelf</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Success</text>
<text x="24" y="111" font-size="24" font-weight="700" fill="#212121">You have the drill</text>
<text x="24" y="149" font-size="16" fill="#424242">Bring it back by Friday.</text>
<g data-to="returned" data-transition="4"><rect x="24" y="172" width="129" height="48" rx="4" fill="#424242"/><text x="88" y="202" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Return it</text><circle cx="173" cy="196" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="173" y="200" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">4</text></g>
<g data-to="report" data-transition="5"><text x="24" y="253" font-size="16" fill="#212121" text-decoration="underline">Report it broken</text><circle cx="172" cy="248" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="172" y="252" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">5</text></g><rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/></g></g>
<g data-state="report"><text x="798" y="594" font-size="14" font-weight="700" fill="#212121">What is wrong with the drill?</text><g transform="translate(798 606) scale(0.5)"><rect x="0" y="0" width="390" height="844" fill="#ffffff"/><rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Tool shelf</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Screen</text>
<text x="24" y="111" font-size="24" font-weight="700" fill="#212121">What is wrong with the</text>
<text x="24" y="143" font-size="24" font-weight="700" fill="#212121">drill?</text>
<text x="24" y="181" font-size="16" font-weight="700" fill="#212121">What is wrong</text>
<rect x="24" y="192" width="342" height="48" fill="#ffffff" stroke="#616161" stroke-width="2"/>
<text x="36" y="222" font-size="16" fill="#424242">The chuck slips</text>
<g data-to="reported" data-transition="6"><rect x="24" y="264" width="183" height="48" rx="4" fill="#424242"/><text x="115" y="294" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Send the report</text><circle cx="227" cy="288" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="227" y="292" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">6</text></g>
<g data-to="borrowed" data-transition="7"><text x="24" y="345" font-size="16" fill="#212121" text-decoration="underline">Back to my loan</text><circle cx="164" cy="340" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="164" y="344" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">7</text></g><rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/></g></g>
<g data-state="returned"><text x="798" y="1104" font-size="14" font-weight="700" fill="#212121">Returned. Thank you</text><g transform="translate(798 1116) scale(0.5)"><rect x="0" y="0" width="390" height="844" fill="#ffffff"/><rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Tool shelf</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Success</text>
<text x="24" y="111" font-size="24" font-weight="700" fill="#212121">Returned. Thank you</text>
<text x="24" y="149" font-size="16" fill="#424242">The drill is back on the shelf.</text>
<g data-to="shelf" data-transition="8"><text x="24" y="189" font-size="16" fill="#212121" text-decoration="underline">Back to the shelf</text><circle cx="180" cy="184" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="180" y="188" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">8</text></g><rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/></g></g>
<g data-state="reported"><text x="798" y="1614" font-size="14" font-weight="700" fill="#212121">Thanks, we told the owner</text><g transform="translate(798 1626) scale(0.5)"><rect x="0" y="0" width="390" height="844" fill="#ffffff"/><rect x="0" y="0" width="390" height="56" fill="#e0e0e0"/>
<text x="24" y="35" font-size="16" font-weight="700" fill="#212121">Tool shelf</text>
<text x="366" y="35" font-size="14" fill="#424242" text-anchor="end">Success</text>
<text x="24" y="111" font-size="24" font-weight="700" fill="#212121">Thanks, we told the</text>
<text x="24" y="143" font-size="24" font-weight="700" fill="#212121">owner</text>
<text x="24" y="181" font-size="16" fill="#424242">Keep the drill until the owner replies.</text>
<g data-to="shelf" data-transition="9"><text x="24" y="221" font-size="16" fill="#212121" text-decoration="underline">Back to the shelf</text><circle cx="180" cy="216" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="180" y="220" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">9</text></g><rect x="1" y="1" width="388" height="842" fill="none" stroke="#9e9e9e" stroke-width="2"/></g></g>
