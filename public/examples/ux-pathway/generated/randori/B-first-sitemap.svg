<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Randori B, before the constraint: Tool shelf sitemap: 8 states and 15 transitions</title>
<desc id="desc">One column per screen. Each box is a state; each numbered line is a transition, listed with its cause in the transition table. Lines are styled by kind: see the legend.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#212121"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#616161"/></marker></defs>
<rect x="0" y="0" width="1000" height="1220" fill="#ffffff"/>
<text x="204" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Shelf</text>
<text x="500" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Tool</text>
<text x="796" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">My loans</text>
<g data-state="shelf"><rect x="112" y="114" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="124" y="136" font-size="14" font-weight="700" fill="#212121">Tools on the shelf</text><text x="124" y="158" font-size="12" fill="#424242">Screen</text><text x="124" y="174" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">shelf</text></g>
<g data-state="tool"><rect x="408" y="114" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="420" y="136" font-size="14" font-weight="700" fill="#212121">Cordless drill</text><text x="420" y="158" font-size="12" fill="#424242">Screen</text><text x="420" y="174" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">tool</text></g>
<g data-state="borrowed"><rect x="704" y="114" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="4"/><text x="716" y="136" font-size="14" font-weight="700" fill="#212121">You have the drill</text><text x="716" y="158" font-size="12" fill="#424242">Success</text><text x="716" y="174" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">borrowed</text></g>
<g data-state="my-loans"><rect x="704" y="266" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="716" y="288" font-size="14" font-weight="700" fill="#212121">My loans</text><text x="716" y="310" font-size="12" fill="#424242">Screen</text><text x="716" y="326" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">my-loans</text></g>
<g data-state="report"><rect x="704" y="418" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="716" y="440" font-size="14" font-weight="700" fill="#212121">Report the drill</text><text x="716" y="458" font-size="14" font-weight="700" fill="#212121">broken</text><text x="716" y="480" font-size="12" fill="#424242">Screen</text><text x="716" y="496" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">report</text></g>
<g data-state="report-error"><rect x="704" y="570" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="3" stroke-dasharray="7 4"/><text x="716" y="592" font-size="14" font-weight="700" fill="#212121">Report the drill</text><text x="716" y="610" font-size="14" font-weight="700" fill="#212121">broken: say what</text><text x="716" y="628" font-size="14" font-weight="700" fill="#212121">happened</text><text x="716" y="650" font-size="12" fill="#424242">Error</text><text x="716" y="666" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">report-error</text></g>
<g data-state="reported"><rect x="704" y="722" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="4"/><text x="716" y="744" font-size="14" font-weight="700" fill="#212121">Thanks, the keeper</text><text x="716" y="762" font-size="14" font-weight="700" fill="#212121">will check it</text><text x="716" y="784" font-size="12" fill="#424242">Success</text><text x="716" y="800" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">reported</text></g>
<g data-state="returned"><rect x="704" y="874" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="4"/><text x="716" y="896" font-size="14" font-weight="700" fill="#212121">Returned</text><text x="716" y="918" font-size="12" fill="#424242">Success</text><text x="716" y="934" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">returned</text></g>
<path d="M296 129 L408 149" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="1"><title>1. shelf to tool: Choose a tool</title></path>
<circle cx="352" cy="139" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="352" y="143" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">1</text>
<path d="M296 159 H310 V90 H606 V301 H704" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#arrow-grey)" data-transition="2"><title>2. shelf to my-loans: My loans</title></path>
<circle cx="458" cy="90" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="458" y="94" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">2</text>
<path d="M592 166 L704 166" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="3"><title>3. tool to borrowed: Borrow</title></path>
<circle cx="648" cy="166" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="648" y="170" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">3</text>
<path d="M408 183 L296 144" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="4"><title>4. tool to shelf: Back to the shelf</title></path>
<circle cx="352" cy="164" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="352" y="168" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">4</text>
<path d="M888 166 H902 V283 H888" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="5"><title>5. borrowed to my-loans: My loans</title></path>
<circle cx="902" cy="225" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="902" y="229" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">5</text>
<path d="M888 353 H914 V926 H888" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="6"><title>6. my-loans to returned: I have returned it</title></path>
<circle cx="914" cy="640" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="914" y="644" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">6</text>
<path d="M888 301 H926 V439 H888" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#arrow-grey)" data-transition="7"><title>7. my-loans to report: Report it broken</title></path>
<circle cx="926" cy="370" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="926" y="374" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">7</text>
<path d="M704 335 H618 V1002 H322 V173 H296" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="8"><title>8. my-loans to shelf: Back to the shelf</title></path>
<circle cx="470" cy="1002" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="470" y="1006" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">8</text>
<path d="M888 501 H938 V757 H888" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="9"><title>9. report to reported: Send report with what happened</title></path>
<circle cx="938" cy="629" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="938" y="633" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">9</text>
<path d="M888 480 H950 V622 H888" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-ink)" data-transition="10"><title>10. report to report-error: Send report with the box empty</title></path>
<circle cx="950" cy="551" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="950" y="555" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">10</text>
<path d="M888 460 H962 V318 H888" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="11"><title>11. report to my-loans: Cancel</title></path>
<circle cx="962" cy="389" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="962" y="393" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">11</text>
<path d="M888 648 H974 V791 H888" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow-ink)" data-transition="12"><title>12. report-error to reported: Say what happened and send</title></path>
