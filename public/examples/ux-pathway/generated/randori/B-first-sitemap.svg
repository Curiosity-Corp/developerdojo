<path d="M888 596 H986 V335 H888" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="13"><title>13. report-error to my-loans: Cancel</title></path>
<circle cx="986" cy="466" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="986" y="470" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">13</text>
<path d="M704 774 H630 V1028 H334 V188 H296" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="14"><title>14. reported to shelf: Back to the shelf</title></path>
<circle cx="482" cy="1028" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="482" y="1032" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">14</text>
<path d="M704 926 H642 V1054 H346 V203 H296" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="15"><title>15. returned to shelf: Back to the shelf</title></path>
<circle cx="494" cy="1054" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="494" y="1058" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">15</text>
<path d="M24 1120 H72" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-kind="forward"/>
<text x="84" y="1125" font-size="14" fill="#212121">Forward</text>
<path d="M168 1120 H216" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#arrow-grey)" data-kind="branch"/>
<text x="228" y="1125" font-size="14" fill="#212121">Branch</text>
<path d="M304 1120 H352" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-ink)" data-kind="error"/>
<text x="364" y="1125" font-size="14" fill="#212121">Error</text>
<path d="M432 1120 H480" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow-ink)" data-kind="recover"/>
<text x="492" y="1125" font-size="14" fill="#212121">Recover</text>
<path d="M576 1120 H624" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-kind="back"/>
<text x="636" y="1125" font-size="14" fill="#212121">Back</text>
<path d="M696 1120 H744" fill="none" stroke="#616161" stroke-width="3" marker-end="url(#arrow-grey)" data-kind="overlay-open"/>
<text x="756" y="1125" font-size="14" fill="#212121">Open dialog</text>
<path d="M24 1148 H72" fill="none" stroke="#616161" stroke-width="3" stroke-dasharray="4 4" marker-end="url(#arrow-grey)" data-kind="overlay-close"/>
<text x="84" y="1153" font-size="14" fill="#212121">Close dialog</text>
<text x="24" y="1180" font-size="14" fill="#424242">Box borders: solid for a screen, thick for success, dashed for an error, dotted for a branch outside this flow, grey for a dialog or an empty state.</text>
</svg>
