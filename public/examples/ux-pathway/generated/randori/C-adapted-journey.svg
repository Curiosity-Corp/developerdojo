<svg xmlns="http://www.w3.org/2000/svg" width="1129" height="1266" viewBox="0 0 1129 1266" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Class trip form journey: every low-fidelity screen on one canvas, connected by its 12 transitions</title>
<desc id="desc">The 6 low-fidelity screens, one column per screen of the sitemap. Each line starts at the button or prototype-only link that causes it and carries the same number as on the sitemap.</desc>
