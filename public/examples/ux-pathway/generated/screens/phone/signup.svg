<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Create your workspace (signup), high fidelity, phone, 390 px</title>
<desc id="desc">The first screen: the fewest fields needed before the user can do real work. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="390" height="844" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="390" height="64" fill="#ffffff"/><rect x="0" y="63" width="390" height="1" fill="#d0d5dd"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="40" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 56">P</text><text x="68" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="68 366">Pocket Invoice</text></g>
<g data-component="Heading/Page" data-element="0"><text x="24" y="122" font-size="24" font-weight="700" fill="#101828" data-fit="24 366">Create your workspace</text></g>
<g data-component="Field/Default" data-element="1"><text x="24" y="166" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Email address</text><text x="24" y="190" font-size="16" fill="#344054" data-fit="24 366">We send your invoices from this</text><text x="24" y="214" font-size="16" fill="#344054" data-fit="24 366">address.</text><rect x="24" y="224" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="36" y="254" font-size="16" fill="#101828" data-fit="36 354">sam@example.com</text></g>
<g data-component="Field/Default" data-element="2"><text x="24" y="314" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Workspace name</text><rect x="24" y="324" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="36" y="354" font-size="16" fill="#101828" data-fit="36 354">Sam Rivera Design</text></g>
<g data-component="Button/Primary" data-element="3" data-to="invoices-empty"><rect x="24" y="396" width="342" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="195" y="426" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 366">Create workspace</text></g>
<g data-component="Button/Link" data-element="4" data-to="sign-in"><text x="24" y="486" font-size="16" fill="#175cd3" text-decoration="underline" data-fit="24 366">I already have an account</text></g>
</svg>
