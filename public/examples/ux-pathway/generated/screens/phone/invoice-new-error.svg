<svg xmlns="http://www.w3.org/2000/svg" width="390" height="962" viewBox="0 0 390 962" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">New invoice: fix two problems (invoice-new-error), high fidelity, phone, 390 px</title>
<desc id="desc">Validation errors on the main task, with the summary linked to each field. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="390" height="962" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="390" height="64" fill="#ffffff"/><rect x="0" y="63" width="390" height="1" fill="#d0d5dd"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="40" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 56">P</text><text x="68" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="68 366">Pocket Invoice</text></g>
<g data-component="ErrorSummary" data-element="0"><rect x="26.5" y="98.5" width="337" height="129" fill="#ffffff" stroke="#b42318" stroke-width="5"/><text x="45" y="138" font-size="19" font-weight="700" fill="#101828" data-fit="45 345">There is a problem</text><text x="45" y="171" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="45 345">Enter the client name</text><text x="45" y="203" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="45 345">Enter an amount greater than 0</text></g>
<g data-component="Heading/Page" data-element="1"><text x="24" y="280" font-size="24" font-weight="700" fill="#101828" data-fit="24 366">New invoice</text></g>
<g data-component="Field/Error" data-element="2"><rect x="24" y="306" width="5" height="100" fill="#b42318"/><text x="41" y="324" font-size="16" font-weight="700" fill="#101828" data-fit="41 366">Client name</text><text x="41" y="348" font-size="16" font-weight="700" fill="#b42318" data-fit="41 366">Error: Enter the client name</text><rect x="41" y="358" width="325" height="48" rx="4" fill="#ffffff" stroke="#b42318" stroke-width="2" data-control="input"/></g>
<g data-component="Field/Default" data-element="3"><text x="24" y="448" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Client email</text><rect x="24" y="458" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="36" y="488" font-size="16" fill="#101828" data-fit="36 354">accounts@harbour-bakery.example</text></g>
<g data-component="Field/Default" data-element="4"><text x="24" y="548" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">What the work was</text><rect x="24" y="558" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="36" y="588" font-size="16" fill="#101828" data-fit="36 354">Menu redesign, two rounds of chang…</text></g>
<g data-component="Field/Error" data-element="5"><rect x="24" y="630" width="5" height="148" fill="#b42318"/><text x="41" y="648" font-size="16" font-weight="700" fill="#101828" data-fit="41 366">Amount in US dollars</text><text x="41" y="672" font-size="16" fill="#344054" data-fit="41 366">For example, 480.00</text><text x="41" y="696" font-size="16" font-weight="700" fill="#b42318" data-fit="41 366">Error: Enter an amount greater</text><text x="41" y="720" font-size="16" font-weight="700" fill="#b42318" data-fit="41 366">than 0</text><rect x="41" y="730" width="325" height="48" rx="4" fill="#ffffff" stroke="#b42318" stroke-width="2" data-control="input"/><text x="53" y="760" font-size="16" fill="#101828" data-fit="53 354">0</text></g>
<g data-component="Button/Primary" data-element="6" data-to="invoice-review"><rect x="24" y="802" width="342" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="195" y="832" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 366">Check invoice</text></g>
<g data-component="Button/Secondary" data-element="7" data-to="discard-dialog"><rect x="24" y="866" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="195" y="896" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="24 366">Cancel</text></g>
