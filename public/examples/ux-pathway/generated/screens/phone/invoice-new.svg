<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">New invoice (invoice-new), high fidelity, phone, 390 px</title>
<desc id="desc">The main task: the details a client needs to pay. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="390" height="844" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="390" height="64" fill="#ffffff"/><rect x="0" y="63" width="390" height="1" fill="#d0d5dd"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="40" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 56">P</text><text x="68" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="68 366">Pocket Invoice</text></g>
<g data-component="Heading/Page" data-element="0"><text x="24" y="122" font-size="24" font-weight="700" fill="#101828" data-fit="24 366">New invoice</text></g>
<g data-component="Field/Default" data-element="1"><text x="24" y="166" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Client name</text><rect x="24" y="176" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="36" y="206" font-size="16" fill="#101828" data-fit="36 354">Harbour Bakery</text></g>
<g data-component="Field/Default" data-element="2"><text x="24" y="266" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Client email</text><rect x="24" y="276" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="36" y="306" font-size="16" fill="#101828" data-fit="36 354">accounts@harbour-bakery.example</text></g>
<g data-component="Field/Default" data-element="3"><text x="24" y="366" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">What the work was</text><rect x="24" y="376" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="36" y="406" font-size="16" fill="#101828" data-fit="36 354">Menu redesign, two rounds of chang…</text></g>
<g data-component="Field/Default" data-element="4"><text x="24" y="466" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Amount in US dollars</text><text x="24" y="490" font-size="16" fill="#344054" data-fit="24 366">For example, 480.00</text><rect x="24" y="500" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="36" y="530" font-size="16" fill="#101828" data-fit="36 354">480.00</text></g>
<g data-component="Button/Primary" data-element="5" data-to="invoice-review"><rect x="24" y="572" width="342" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="195" y="602" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 366">Check invoice</text></g>
<g data-component="Button/Secondary" data-element="6" data-to="discard-dialog"><rect x="24" y="636" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="195" y="666" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="24 366">Cancel</text></g>
</svg>
