<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">The invoice was not sent (send-error), high fidelity, phone, 390 px</title>
<desc id="desc">A failure after the user pressed Send: says what happened, that nothing was sent, and what to do. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="390" height="844" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="390" height="64" fill="#ffffff"/><rect x="0" y="63" width="390" height="1" fill="#d0d5dd"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="40" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 56">P</text><text x="68" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="68 366">Pocket Invoice</text></g>
<g data-component="Heading/Page" data-element="0"><text x="24" y="122" font-size="24" font-weight="700" fill="#101828" data-fit="24 366">The invoice was not</text><text x="24" y="158" font-size="24" font-weight="700" fill="#101828" data-fit="24 366">sent</text></g>
<g data-component="ErrorSummary" data-element="1"><rect x="26.5" y="186.5" width="337" height="145" fill="#ffffff" stroke="#b42318" stroke-width="5"/><text x="45" y="226" font-size="19" font-weight="700" fill="#101828" data-fit="45 345">There is a problem</text><text x="45" y="259" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="45 345">The client email address</text><text x="45" y="283" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="45 345">cannot receive mail. Check the</text><text x="45" y="307" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="45 345">address and try again.</text></g>
<g data-component="Text/Body" data-element="2"><text x="24" y="376" font-size="16" fill="#344054" data-fit="24 366">Nothing was sent. Your invoice is</text><text x="24" y="400" font-size="16" fill="#344054" data-fit="24 366">saved as a draft.</text></g>
<g data-component="Button/Primary" data-element="3" data-to="invoice-new"><rect x="24" y="430" width="342" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="195" y="460" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 366">Change the email address</text></g>
</svg>
