<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Check the invoice (invoice-review), high fidelity, phone, 390 px</title>
<desc id="desc">One look at everything before it goes to the client, with a way to change any of it. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="390" height="844" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="390" height="64" fill="#ffffff"/><rect x="0" y="63" width="390" height="1" fill="#d0d5dd"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="40" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 56">P</text><text x="68" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="68 366">Pocket Invoice</text></g>
<g data-component="Heading/Page" data-element="0"><text x="24" y="122" font-size="24" font-weight="700" fill="#101828" data-fit="24 366">Check the invoice</text></g>
<g data-component="SummaryList" data-element="1" data-variant="stacked"><text x="24" y="178" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Client</text><text x="24" y="202" font-size="16" fill="#101828" data-fit="24 366">Harbour Bakery</text><rect x="24" y="220" width="342" height="1" fill="#d0d5dd"/><text x="24" y="251" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Send to</text><text x="24" y="275" font-size="16" fill="#101828" data-fit="24 366">accounts@harbour-bakery.example</text><rect x="24" y="293" width="342" height="1" fill="#d0d5dd"/><text x="24" y="324" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Work</text><text x="24" y="348" font-size="16" fill="#101828" data-fit="24 366">Menu redesign, two rounds of changes</text><rect x="24" y="366" width="342" height="1" fill="#d0d5dd"/><text x="24" y="397" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Amount</text><text x="24" y="421" font-size="16" fill="#101828" data-fit="24 366">$480.00</text><rect x="24" y="439" width="342" height="1" fill="#d0d5dd"/><text x="24" y="470" font-size="16" font-weight="700" fill="#101828" data-fit="24 366">Due</text><text x="24" y="494" font-size="16" fill="#101828" data-fit="24 366">In 30 days</text><rect x="24" y="512" width="342" height="1" fill="#d0d5dd"/></g>
<g data-component="Button/Primary" data-element="2" data-to="invoice-sent"><rect x="24" y="537" width="342" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="195" y="567" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 366">Send invoice</text></g>
<g data-component="Button/Secondary" data-element="3" data-to="invoice-new"><rect x="24" y="601" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="195" y="631" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="24 366">Change details</text></g>
</svg>
