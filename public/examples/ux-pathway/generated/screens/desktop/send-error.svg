<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">The invoice was not sent (send-error), high fidelity, desktop, 1440 px</title>
<desc id="desc">A failure after the user pressed Send: says what happened, that nothing was sent, and what to do. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="1440" height="900" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="1440" height="64" fill="#ffffff"/><rect x="0" y="63" width="1440" height="1" fill="#d0d5dd"/><rect x="32" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="48" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="32 64">P</text><text x="76" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="76 1416">Pocket Invoice</text><text x="1408" y="38" font-size="16" fill="#175cd3" text-anchor="end" text-decoration="underline" data-fit="1320 1408">Invoices</text></g>
<rect x="400" y="112" width="640" height="370" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
<g data-component="Heading/Page" data-element="0"><text x="432" y="177" font-size="32" font-weight="700" fill="#101828" data-fit="432 1008">The invoice was not sent</text></g>
<g data-component="ErrorSummary" data-element="1"><rect x="434.5" y="206.5" width="571" height="121" fill="#ffffff" stroke="#b42318" stroke-width="5"/><text x="453" y="246" font-size="19" font-weight="700" fill="#101828" data-fit="453 987">There is a problem</text><text x="453" y="279" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="453 987">The client email address cannot receive mail. Check</text><text x="453" y="303" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="453 987">the address and try again.</text></g>
<g data-component="Text/Body" data-element="2"><text x="432" y="372" font-size="16" fill="#344054" data-fit="432 1008">Nothing was sent. Your invoice is saved as a draft.</text></g>
<g data-component="Button/Primary" data-element="3" data-to="invoice-new"><rect x="432" y="402" width="287" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="575.5" y="432" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="432 719">Change the email address</text></g>
</svg>
