<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Invoices: one sent (invoices-list), high fidelity, desktop, 1440 px</title>
<desc id="desc">The same screen as the empty state, now with the result of the journey in it. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="1440" height="900" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="1440" height="64" fill="#ffffff"/><rect x="0" y="63" width="1440" height="1" fill="#d0d5dd"/><rect x="32" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="48" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="32 64">P</text><text x="76" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="76 1416">Pocket Invoice</text><text x="1408" y="38" font-size="16" fill="#175cd3" text-anchor="end" text-decoration="underline" data-fit="1320 1408">Invoices</text></g>
<rect x="400" y="112" width="640" height="287" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
<g data-component="Heading/Page" data-element="0"><text x="432" y="177" font-size="32" font-weight="700" fill="#101828" data-fit="432 1008">Invoices</text></g>
<g data-component="Table" data-element="1" data-variant="table"><text x="432" y="230" font-size="16" font-weight="700" fill="#101828" data-fit="432 568">Number</text><text x="576" y="230" font-size="16" font-weight="700" fill="#101828" data-fit="576 712">Client</text><text x="720" y="230" font-size="16" font-weight="700" fill="#101828" data-fit="720 856">Amount</text><text x="864" y="230" font-size="16" font-weight="700" fill="#101828" data-fit="864 1000">Status</text><rect x="432" y="244" width="576" height="2" fill="#101828"/><text x="432" y="276" font-size="16" fill="#101828" data-fit="432 568">INV-0001</text><text x="576" y="276" font-size="16" fill="#101828" data-fit="576 712">Harbour Bakery</text><text x="720" y="276" font-size="16" fill="#101828" data-fit="720 856">$480.00</text><text x="864" y="276" font-size="16" fill="#101828" data-fit="864 1000">Sent</text><rect x="432" y="294" width="576" height="1" fill="#d0d5dd"/></g>
<g data-component="Button/Primary" data-element="2" data-to="invoice-new"><rect x="432" y="319" width="187" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="525.5" y="349" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="432 619">Create invoice</text></g>
</svg>
