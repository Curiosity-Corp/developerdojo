<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Create your workspace (signup), high fidelity, desktop, 1440 px</title>
<desc id="desc">The first screen: the fewest fields needed before the user can do real work. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="1440" height="900" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="1440" height="64" fill="#ffffff"/><rect x="0" y="63" width="1440" height="1" fill="#d0d5dd"/><rect x="32" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="48" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="32 64">P</text><text x="76" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="76 1416">Pocket Invoice</text></g>
<rect x="400" y="112" width="640" height="444" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
<g data-component="Heading/Page" data-element="0"><text x="432" y="177" font-size="32" font-weight="700" fill="#101828" data-fit="432 1008">Create your workspace</text></g>
<g data-component="Field/Default" data-element="1"><text x="432" y="222" font-size="16" font-weight="700" fill="#101828" data-fit="432 1008">Email address</text><text x="432" y="246" font-size="16" fill="#344054" data-fit="432 1008">We send your invoices from this address.</text><rect x="432" y="256" width="576" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="444" y="286" font-size="16" fill="#101828" data-fit="444 996">sam@example.com</text></g>
<g data-component="Field/Default" data-element="2"><text x="432" y="346" font-size="16" font-weight="700" fill="#101828" data-fit="432 1008">Workspace name</text><rect x="432" y="356" width="576" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="444" y="386" font-size="16" fill="#101828" data-fit="444 996">Sam Rivera Design</text></g>
<g data-component="Button/Primary" data-element="3" data-to="invoices-empty"><rect x="432" y="428" width="207" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="535.5" y="458" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="432 639">Create workspace</text></g>
<g data-component="Button/Link" data-element="4" data-to="sign-in"><text x="432" y="518" font-size="16" fill="#175cd3" text-decoration="underline" data-fit="432 1008">I already have an account</text></g>
</svg>
