<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Discard this invoice? (discard-dialog), high fidelity, desktop, 1440 px</title>
<desc id="desc">A confirmation over the form, so a slip of the finger does not throw work away. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="1440" height="900" fill="#344054"/>
<g data-component="Dialog"><rect x="440" y="240" width="560" height="212" rx="8" fill="#ffffff"/><g data-component="Heading/Page" data-element="0"><text x="472" y="298" font-size="24" font-weight="700" fill="#101828" data-fit="472 968">Discard this invoice?</text></g><g data-component="Text/Body" data-element="1"><text x="472" y="342" font-size="16" fill="#344054" data-fit="472 968">What you entered will be lost.</text></g><g data-component="Button/Primary" data-element="2" data-to="invoice-new"><rect x="472" y="372" width="168" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="556" y="402" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="472 640">Keep editing</text></g><g data-component="Button/Secondary" data-element="3" data-to="invoices-empty"><rect x="656" y="372" width="118" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="715" y="402" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="656 774">Discard</text></g></g>
</svg>
