<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Create your workspace: fix two problems (signup-error), high fidelity, desktop, 1440 px</title>
<desc id="desc">Shows every problem at once, names how to fix each, and keeps what the user typed. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="1440" height="900" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="1440" height="64" fill="#ffffff"/><rect x="0" y="63" width="1440" height="1" fill="#d0d5dd"/><rect x="32" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="48" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="32 64">P</text><text x="76" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="76 1416">Pocket Invoice</text></g>
<rect x="400" y="112" width="640" height="650" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
<g data-component="ErrorSummary" data-element="0"><rect x="434.5" y="146.5" width="571" height="153" fill="#ffffff" stroke="#b42318" stroke-width="5"/><text x="453" y="186" font-size="19" font-weight="700" fill="#101828" data-fit="453 987">There is a problem</text><text x="453" y="219" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="453 987">Enter an email address in the correct format, like</text><text x="453" y="243" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="453 987">name@example.com</text><text x="453" y="275" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="453 987">Enter a workspace name</text></g>
<g data-component="Heading/Page" data-element="1"><text x="432" y="359" font-size="32" font-weight="700" fill="#101828" data-fit="432 1008">Create your workspace</text></g>
<g data-component="Field/Error" data-element="2"><rect x="432" y="386" width="5" height="148" fill="#b42318"/><text x="449" y="404" font-size="16" font-weight="700" fill="#101828" data-fit="449 1008">Email address</text><text x="449" y="428" font-size="16" fill="#344054" data-fit="449 1008">We send your invoices from this address.</text><text x="449" y="452" font-size="16" font-weight="700" fill="#b42318" data-fit="449 1008">Error: Enter an email address in the correct format,</text><text x="449" y="476" font-size="16" font-weight="700" fill="#b42318" data-fit="449 1008">like name@example.com</text><rect x="449" y="486" width="559" height="48" rx="4" fill="#ffffff" stroke="#b42318" stroke-width="2" data-control="input"/><text x="461" y="516" font-size="16" fill="#101828" data-fit="461 996">sam@example</text></g>
<g data-component="Field/Error" data-element="3"><rect x="432" y="558" width="5" height="100" fill="#b42318"/><text x="449" y="576" font-size="16" font-weight="700" fill="#101828" data-fit="449 1008">Workspace name</text><text x="449" y="600" font-size="16" font-weight="700" fill="#b42318" data-fit="449 1008">Error: Enter a workspace name</text><rect x="449" y="610" width="559" height="48" rx="4" fill="#ffffff" stroke="#b42318" stroke-width="2" data-control="input"/></g>
<g data-component="Button/Primary" data-element="4" data-to="invoices-empty"><rect x="432" y="682" width="207" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="535.5" y="712" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="432 639">Create workspace</text></g>
</svg>
