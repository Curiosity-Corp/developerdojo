<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Invoices: one sent (invoices-list), high fidelity, phone, 390 px</title>
<desc id="desc">The same screen as the empty state, now with the result of the journey in it. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="390" height="844" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="390" height="64" fill="#ffffff"/><rect x="0" y="63" width="390" height="1" fill="#d0d5dd"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="40" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 56">P</text><text x="68" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="68 366">Pocket Invoice</text></g>
<g data-component="Heading/Page" data-element="0"><text x="24" y="122" font-size="24" font-weight="700" fill="#101828" data-fit="24 366">Invoices</text></g>
<g data-component="Table" data-element="1" data-variant="stacked"><rect x="24" y="148" width="342" height="2" fill="#101828"/><text x="24" y="180" font-size="16" font-weight="700" fill="#101828" data-fit="24 144">Number</text><text x="152" y="180" font-size="16" fill="#101828" data-fit="152 366">INV-0001</text><text x="24" y="208" font-size="16" font-weight="700" fill="#101828" data-fit="24 144">Client</text><text x="152" y="208" font-size="16" fill="#101828" data-fit="152 366">Harbour Bakery</text><text x="24" y="236" font-size="16" font-weight="700" fill="#101828" data-fit="24 144">Amount</text><text x="152" y="236" font-size="16" fill="#101828" data-fit="152 366">$480.00</text><text x="24" y="264" font-size="16" font-weight="700" fill="#101828" data-fit="24 144">Status</text><text x="152" y="264" font-size="16" fill="#101828" data-fit="152 366">Sent</text><rect x="24" y="282" width="342" height="1" fill="#d0d5dd"/></g>
<g data-component="Button/Primary" data-element="2" data-to="invoice-new"><rect x="24" y="307" width="342" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="195" y="337" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 366">Create invoice</text></g>
</svg>
