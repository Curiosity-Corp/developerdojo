<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Sign in (sign-in), high fidelity, phone, 390 px</title>
<desc id="desc">A branch the example does not build. It says so and offers the way back, so the user is never stranded. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="390" height="844" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="390" height="64" fill="#ffffff"/><rect x="0" y="63" width="390" height="1" fill="#d0d5dd"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="40" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 56">P</text><text x="68" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="68 366">Pocket Invoice</text></g>
<g data-component="Heading/Page" data-element="0"><text x="24" y="122" font-size="24" font-weight="700" fill="#101828" data-fit="24 366">Sign in</text></g>
<g data-component="Text/Body" data-element="1"><text x="24" y="166" font-size="16" fill="#344054" data-fit="24 366">Signing in is not part of this</text><text x="24" y="190" font-size="16" fill="#344054" data-fit="24 366">practice example. Nothing you typed</text><text x="24" y="214" font-size="16" fill="#344054" data-fit="24 366">has been sent anywhere.</text></g>
<g data-component="Button/Secondary" data-element="2" data-to="signup"><rect x="24" y="244" width="342" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="195" y="274" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="24 366">Back to create a workspace</text></g>
</svg>
