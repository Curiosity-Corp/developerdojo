<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Create your workspace: fix two problems (signup-error), high fidelity, phone, 390 px</title>
<desc id="desc">Shows every problem at once, names how to fix each, and keeps what the user typed. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="390" height="844" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="390" height="64" fill="#ffffff"/><rect x="0" y="63" width="390" height="1" fill="#d0d5dd"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="40" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 56">P</text><text x="68" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="68 366">Pocket Invoice</text></g>
<g data-component="ErrorSummary" data-element="0"><rect x="26.5" y="98.5" width="337" height="177" fill="#ffffff" stroke="#b42318" stroke-width="5"/><text x="45" y="138" font-size="19" font-weight="700" fill="#101828" data-fit="45 345">There is a problem</text><text x="45" y="171" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="45 345">Enter an email address in the</text><text x="45" y="195" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="45 345">correct format, like</text><text x="45" y="219" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="45 345">name@example.com</text><text x="45" y="251" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="45 345">Enter a workspace name</text></g>
<g data-component="Heading/Page" data-element="1"><text x="24" y="328" font-size="24" font-weight="700" fill="#101828" data-fit="24 366">Create your workspace</text></g>
<g data-component="Field/Error" data-element="2"><rect x="24" y="354" width="5" height="196" fill="#b42318"/><text x="41" y="372" font-size="16" font-weight="700" fill="#101828" data-fit="41 366">Email address</text><text x="41" y="396" font-size="16" fill="#344054" data-fit="41 366">We send your invoices from this</text><text x="41" y="420" font-size="16" fill="#344054" data-fit="41 366">address.</text><text x="41" y="444" font-size="16" font-weight="700" fill="#b42318" data-fit="41 366">Error: Enter an email address in</text><text x="41" y="468" font-size="16" font-weight="700" fill="#b42318" data-fit="41 366">the correct format, like</text><text x="41" y="492" font-size="16" font-weight="700" fill="#b42318" data-fit="41 366">name@example.com</text><rect x="41" y="502" width="325" height="48" rx="4" fill="#ffffff" stroke="#b42318" stroke-width="2" data-control="input"/><text x="53" y="532" font-size="16" fill="#101828" data-fit="53 354">sam@example</text></g>
<g data-component="Field/Error" data-element="3"><rect x="24" y="574" width="5" height="100" fill="#b42318"/><text x="41" y="592" font-size="16" font-weight="700" fill="#101828" data-fit="41 366">Workspace name</text><text x="41" y="616" font-size="16" font-weight="700" fill="#b42318" data-fit="41 366">Error: Enter a workspace name</text><rect x="41" y="626" width="325" height="48" rx="4" fill="#ffffff" stroke="#b42318" stroke-width="2" data-control="input"/></g>
<g data-component="Button/Primary" data-element="4" data-to="invoices-empty"><rect x="24" y="698" width="342" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="195" y="728" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="24 366">Create workspace</text></g>
</svg>
