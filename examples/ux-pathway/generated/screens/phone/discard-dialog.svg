<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Discard this invoice? (discard-dialog), high fidelity, phone, 390 px</title>
<desc id="desc">A confirmation over the form, so a slip of the finger does not throw work away. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="390" height="844" fill="#344054"/>
<g data-component="Dialog"><rect x="24" y="200" width="342" height="296" rx="8" fill="#ffffff"/><g data-component="Heading/Page" data-element="0"><text x="48" y="250" font-size="24" font-weight="700" fill="#101828" data-fit="48 342">Discard this</text><text x="48" y="286" font-size="24" font-weight="700" fill="#101828" data-fit="48 342">invoice?</text></g><g data-component="Text/Body" data-element="1"><text x="48" y="330" font-size="16" fill="#344054" data-fit="48 342">What you entered will be lost.</text></g><g data-component="Button/Primary" data-element="2" data-to="invoice-new"><rect x="48" y="360" width="294" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="195" y="390" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="48 342">Keep editing</text></g><g data-component="Button/Secondary" data-element="3" data-to="invoices-empty"><rect x="48" y="424" width="294" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="195" y="454" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="48 342">Discard</text></g></g>
</svg>
