<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">New invoice (invoice-new), high fidelity, desktop, 1440 px</title>
<desc id="desc">The main task: the details a client needs to pay. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="1440" height="900" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="1440" height="64" fill="#ffffff"/><rect x="0" y="63" width="1440" height="1" fill="#d0d5dd"/><rect x="32" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="48" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="32 64">P</text><text x="76" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="76 1416">Pocket Invoice</text><text x="1408" y="38" font-size="16" fill="#175cd3" text-anchor="end" text-decoration="underline" data-fit="1320 1408">Invoices</text></g>
<rect x="400" y="112" width="640" height="596" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
<g data-component="Heading/Page" data-element="0"><text x="432" y="177" font-size="32" font-weight="700" fill="#101828" data-fit="432 1008">New invoice</text></g>
<g data-component="Field/Default" data-element="1"><text x="432" y="222" font-size="16" font-weight="700" fill="#101828" data-fit="432 1008">Client name</text><rect x="432" y="232" width="576" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="444" y="262" font-size="16" fill="#101828" data-fit="444 996">Harbour Bakery</text></g>
<g data-component="Field/Default" data-element="2"><text x="432" y="322" font-size="16" font-weight="700" fill="#101828" data-fit="432 1008">Client email</text><rect x="432" y="332" width="576" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="444" y="362" font-size="16" fill="#101828" data-fit="444 996">accounts@harbour-bakery.example</text></g>
<g data-component="Field/Default" data-element="3"><text x="432" y="422" font-size="16" font-weight="700" fill="#101828" data-fit="432 1008">What the work was</text><rect x="432" y="432" width="576" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="444" y="462" font-size="16" fill="#101828" data-fit="444 996">Menu redesign, two rounds of changes</text></g>
<g data-component="Field/Default" data-element="4"><text x="432" y="522" font-size="16" font-weight="700" fill="#101828" data-fit="432 1008">Amount in US dollars</text><text x="432" y="546" font-size="16" fill="#344054" data-fit="432 1008">For example, 480.00</text><rect x="432" y="556" width="576" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="444" y="586" font-size="16" fill="#101828" data-fit="444 996">480.00</text></g>
<g data-component="Button/Primary" data-element="5" data-to="invoice-review"><rect x="432" y="628" width="177" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="520.5" y="658" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="432 609">Check invoice</text></g>
<g data-component="Button/Secondary" data-element="6" data-to="discard-dialog"><rect x="625" y="628" width="108" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="679" y="658" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="625 733">Cancel</text></g>
</svg>
