<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="962" viewBox="0 0 1440 962" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">New invoice: fix two problems (invoice-new-error), high fidelity, desktop, 1440 px</title>
<desc id="desc">Validation errors on the main task, with the summary linked to each field. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="1440" height="962" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="1440" height="64" fill="#ffffff"/><rect x="0" y="63" width="1440" height="1" fill="#d0d5dd"/><rect x="32" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="48" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="32 64">P</text><text x="76" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="76 1416">Pocket Invoice</text><text x="1408" y="38" font-size="16" fill="#175cd3" text-anchor="end" text-decoration="underline" data-fit="1320 1408">Invoices</text></g>
<rect x="400" y="112" width="640" height="802" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
<g data-component="ErrorSummary" data-element="0"><rect x="434.5" y="146.5" width="571" height="129" fill="#ffffff" stroke="#b42318" stroke-width="5"/><text x="453" y="186" font-size="19" font-weight="700" fill="#101828" data-fit="453 987">There is a problem</text><text x="453" y="219" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="453 987">Enter the client name</text><text x="453" y="251" font-size="16" font-weight="700" fill="#b42318" text-decoration="underline" data-fit="453 987">Enter an amount greater than 0</text></g>
<g data-component="Heading/Page" data-element="1"><text x="432" y="335" font-size="32" font-weight="700" fill="#101828" data-fit="432 1008">New invoice</text></g>
<g data-component="Field/Error" data-element="2"><rect x="432" y="362" width="5" height="100" fill="#b42318"/><text x="449" y="380" font-size="16" font-weight="700" fill="#101828" data-fit="449 1008">Client name</text><text x="449" y="404" font-size="16" font-weight="700" fill="#b42318" data-fit="449 1008">Error: Enter the client name</text><rect x="449" y="414" width="559" height="48" rx="4" fill="#ffffff" stroke="#b42318" stroke-width="2" data-control="input"/></g>
<g data-component="Field/Default" data-element="3"><text x="432" y="504" font-size="16" font-weight="700" fill="#101828" data-fit="432 1008">Client email</text><rect x="432" y="514" width="576" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="444" y="544" font-size="16" fill="#101828" data-fit="444 996">accounts@harbour-bakery.example</text></g>
<g data-component="Field/Default" data-element="4"><text x="432" y="604" font-size="16" font-weight="700" fill="#101828" data-fit="432 1008">What the work was</text><rect x="432" y="614" width="576" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="input"/><text x="444" y="644" font-size="16" fill="#101828" data-fit="444 996">Menu redesign, two rounds of changes</text></g>
<g data-component="Field/Error" data-element="5"><rect x="432" y="686" width="5" height="124" fill="#b42318"/><text x="449" y="704" font-size="16" font-weight="700" fill="#101828" data-fit="449 1008">Amount in US dollars</text><text x="449" y="728" font-size="16" fill="#344054" data-fit="449 1008">For example, 480.00</text><text x="449" y="752" font-size="16" font-weight="700" fill="#b42318" data-fit="449 1008">Error: Enter an amount greater than 0</text><rect x="449" y="762" width="559" height="48" rx="4" fill="#ffffff" stroke="#b42318" stroke-width="2" data-control="input"/><text x="461" y="792" font-size="16" fill="#101828" data-fit="461 996">0</text></g>
<g data-component="Button/Primary" data-element="6" data-to="invoice-review"><rect x="432" y="834" width="177" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="520.5" y="864" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="432 609">Check invoice</text></g>
<g data-component="Button/Secondary" data-element="7" data-to="discard-dialog"><rect x="625" y="834" width="108" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="679" y="864" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="625 733">Cancel</text></g>
</svg>
