<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" font-family="Source Sans Pro, sans-serif">
<title id="title">Check the invoice (invoice-review), high fidelity, desktop, 1440 px</title>
<desc id="desc">One look at everything before it goes to the client, with a way to change any of it. Drawn from the token file and the components; every colour, size, weight, radius and border is a token value.</desc>
<rect x="0" y="0" width="1440" height="900" fill="#f5f7fa"/>
<g data-component="AppBar"><rect x="0" y="0" width="1440" height="64" fill="#ffffff"/><rect x="0" y="63" width="1440" height="1" fill="#d0d5dd"/><rect x="32" y="16" width="32" height="32" rx="8" fill="#175cd3"/><text x="48" y="39" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="32 64">P</text><text x="76" y="39" font-size="19" font-weight="700" fill="#101828" data-fit="76 1416">Pocket Invoice</text><text x="1408" y="38" font-size="16" fill="#175cd3" text-anchor="end" text-decoration="underline" data-fit="1320 1408">Invoices</text></g>
<rect x="400" y="112" width="640" height="441" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
<g data-component="Heading/Page" data-element="0"><text x="432" y="177" font-size="32" font-weight="700" fill="#101828" data-fit="432 1008">Check the invoice</text></g>
<g data-component="SummaryList" data-element="1" data-variant="columns"><text x="432" y="234" font-size="16" font-weight="700" fill="#101828" data-fit="432 618">Client</text><text x="634" y="234" font-size="16" fill="#101828" data-fit="634 1008">Harbour Bakery</text><rect x="432" y="252" width="576" height="1" fill="#d0d5dd"/><text x="432" y="283" font-size="16" font-weight="700" fill="#101828" data-fit="432 618">Send to</text><text x="634" y="283" font-size="16" fill="#101828" data-fit="634 1008">accounts@harbour-bakery.example</text><rect x="432" y="301" width="576" height="1" fill="#d0d5dd"/><text x="432" y="332" font-size="16" font-weight="700" fill="#101828" data-fit="432 618">Work</text><text x="634" y="332" font-size="16" fill="#101828" data-fit="634 1008">Menu redesign, two rounds of changes</text><rect x="432" y="350" width="576" height="1" fill="#d0d5dd"/><text x="432" y="381" font-size="16" font-weight="700" fill="#101828" data-fit="432 618">Amount</text><text x="634" y="381" font-size="16" fill="#101828" data-fit="634 1008">$480.00</text><rect x="432" y="399" width="576" height="1" fill="#d0d5dd"/><text x="432" y="430" font-size="16" font-weight="700" fill="#101828" data-fit="432 618">Due</text><text x="634" y="430" font-size="16" fill="#101828" data-fit="634 1008">In 30 days</text><rect x="432" y="448" width="576" height="1" fill="#d0d5dd"/></g>
<g data-component="Button/Primary" data-element="2" data-to="invoice-sent"><rect x="432" y="473" width="168" height="48" rx="4" fill="#175cd3" data-control="button"/><text x="516" y="503" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-fit="432 600">Send invoice</text></g>
<g data-component="Button/Secondary" data-element="3" data-to="invoice-new"><rect x="616" y="473" width="187" height="48" rx="4" fill="#ffffff" stroke="#667085" stroke-width="2" data-control="button"/><text x="709.5" y="503" font-size="16" font-weight="700" fill="#101828" text-anchor="middle" data-fit="616 803">Change details</text></g>
</svg>
