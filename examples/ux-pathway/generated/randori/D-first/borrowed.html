<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You have the drill: Randori round D, first version, before the constraint</title>
<style>
body { margin: 0; font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1b1f24; background: #fff; }
.note { margin: 0; padding: 0.5rem 1rem; background: #f1f3f5; color: #3d4752; font-size: 0.875rem; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 9rem); gap: 0.75rem 1rem; align-items: start; max-width: 36rem; margin: 1.5rem auto; padding: 0 1rem; }
h1 { margin: 0; font-size: 1.5rem; } p { margin: 0; }
label { display: grid; gap: 0.25rem; font-weight: 600; } input { font: inherit; padding: 0.5rem; border: 1px solid #5c6670; border-radius: 4px; }
form { margin: 0; } button { font: inherit; font-weight: 700; padding: 0.625rem 1rem; border-radius: 4px; border: 2px solid #1a4fd6; width: 100%; }
button.primary { background: #1a4fd6; color: #fff; } button.secondary { background: #fff; color: #1a4fd6; }
a { color: #1a4fd6; } a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #b3261e; outline-offset: 2px; }
</style>
</head>
<body data-round="D" data-version="first" data-state="borrowed">
<p class="note">Worked UX Randori round D, first version, before the constraint. A wireframe screen for the keyboard check, not a working app.</p>
<main>
<h1 style="grid-column: 1 / -1;">You have the drill</h1>
<p style="grid-column: 1 / -1;">Bring it back by Friday.</p>
<label style="grid-column: 1 / -1;">Anything wrong with it? <input name="Anything wrong with it?" value="The chuck slips" data-control="Anything wrong with it?"></label>
<form action="returned.html" method="get" style="grid-column: 1 / -1;"><button type="submit" class="primary" data-control="Return it">Return it</button></form>
<form action="reported.html" method="get" style="grid-column: 1 / -1;"><button type="submit" class="secondary" data-control="Report it broken">Report it broken</button></form>
</main>
</body>
</html>
