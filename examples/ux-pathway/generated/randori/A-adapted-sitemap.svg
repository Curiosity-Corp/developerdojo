<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Randori A, after the constraint: Library reservations sitemap: 7 states and 13 transitions</title>
<desc id="desc">One column per screen. Each box is a state; each numbered line is a transition, listed with its cause in the transition table. Lines are styled by kind: see the legend.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#212121"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#616161"/></marker></defs>
<rect x="0" y="0" width="1000" height="840" fill="#ffffff"/>
<text x="204" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Catalogue</text>
<text x="500" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Book</text>
<text x="796" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">My reservations</text>
<g data-state="search"><rect x="112" y="64" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="124" y="86" font-size="14" font-weight="700" fill="#212121">Find a book</text><text x="124" y="108" font-size="12" fill="#424242">Screen</text><text x="124" y="124" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">search</text></g>
<g data-state="results"><rect x="112" y="216" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="124" y="238" font-size="14" font-weight="700" fill="#212121">2 books found</text><text x="124" y="260" font-size="12" fill="#424242">Screen</text><text x="124" y="276" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">results</text></g>
<g data-state="book"><rect x="408" y="64" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="420" y="86" font-size="14" font-weight="700" fill="#212121">The Night Garden</text><text x="420" y="108" font-size="12" fill="#424242">Screen</text><text x="420" y="124" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">book</text></g>
<g data-state="reserved"><rect x="704" y="64" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="4"/><text x="716" y="86" font-size="14" font-weight="700" fill="#212121">Reserved</text><text x="716" y="108" font-size="12" fill="#424242">Success</text><text x="716" y="124" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">reserved</text></g>
<g data-state="my-reservations"><rect x="704" y="216" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="716" y="238" font-size="14" font-weight="700" fill="#212121">My reservations</text><text x="716" y="260" font-size="12" fill="#424242">Screen</text><text x="716" y="276" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">my-reservations</text></g>
<g data-state="cancelled"><rect x="704" y="368" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="4"/><text x="716" y="390" font-size="14" font-weight="700" fill="#212121">Reservation cancelled</text><text x="716" y="412" font-size="12" fill="#424242">Success</text><text x="716" y="428" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">cancelled</text></g>
<g data-state="ready"><rect x="704" y="520" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="716" y="542" font-size="14" font-weight="700" fill="#212121">Ready to collect</text><text x="716" y="564" font-size="12" fill="#424242">Screen</text><text x="716" y="580" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">ready</text></g>
<path d="M296 85 H310 V237 H296" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="1"><title>1. search to results: Search</title></path>
<circle cx="310" cy="161" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="310" y="165" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">1</text>
<path d="M296 278 L408 99" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="2"><title>2. results to book: Choose a book</title></path>
<circle cx="352" cy="189" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="352" y="193" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">2</text>
<path d="M296 258 H322 V106 H296" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="3"><title>3. results to search: Change the search</title></path>
<circle cx="322" cy="182" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="322" y="186" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">3</text>
<path d="M592 99 L704 99" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="4"><title>4. book to reserved: Reserve</title></path>
<circle cx="648" cy="99" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="648" y="103" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">4</text>
<path d="M408 133 L296 299" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="5"><title>5. book to results: Back to the results</title></path>
<circle cx="352" cy="216" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="352" y="220" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">5</text>
<path d="M704 133 L592 133" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="6"><title>6. reserved to book: Undo, within 30 seconds</title></path>
<circle cx="648" cy="133" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="648" y="137" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">6</text>
<path d="M888 116 H902 V233 H888" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="7"><title>7. reserved to my-reservations: My reservations</title></path>
<circle cx="902" cy="175" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="902" y="179" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">7</text>
<path d="M888 251 H914 V403 H888" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="8"><title>8. my-reservations to cancelled: Cancel reservation</title></path>
<circle cx="914" cy="327" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="914" y="331" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">8</text>
<path d="M704 268 H606 V648 H334 V126 H296" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="9"><title>9. my-reservations to search: Find another book</title></path>
<circle cx="470" cy="648" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="470" y="652" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">9</text>
<path d="M888 285 H926 V555 H888" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#arrow-grey)" data-transition="10"><title>10. my-reservations to ready: The book comes back; the email links here</title></path>
<circle cx="926" cy="420" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="926" y="424" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">10</text>
<path d="M888 437 H938 V268 H888" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="11"><title>11. cancelled to my-reservations: Undo, within 30 seconds</title></path>
<circle cx="938" cy="353" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="938" y="357" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">11</text>
<path d="M704 420 H618 V674 H346 V147 H296" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="12"><title>12. cancelled to search: Find another book</title></path>
<circle cx="482" cy="674" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="482" y="678" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">12</text>
<path d="M888 589 H950 V303 H888" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="13"><title>13. ready to my-reservations: My reservations</title></path>
<circle cx="950" cy="446" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="950" y="450" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">13</text>
<path d="M24 740 H72" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-kind="forward"/>
<text x="84" y="745" font-size="14" fill="#212121">Forward</text>
<path d="M168 740 H216" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#arrow-grey)" data-kind="branch"/>
<text x="228" y="745" font-size="14" fill="#212121">Branch</text>
<path d="M304 740 H352" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-ink)" data-kind="error"/>
<text x="364" y="745" font-size="14" fill="#212121">Error</text>
<path d="M432 740 H480" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow-ink)" data-kind="recover"/>
<text x="492" y="745" font-size="14" fill="#212121">Recover</text>
<path d="M576 740 H624" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-kind="back"/>
<text x="636" y="745" font-size="14" fill="#212121">Back</text>
<path d="M696 740 H744" fill="none" stroke="#616161" stroke-width="3" marker-end="url(#arrow-grey)" data-kind="overlay-open"/>
<text x="756" y="745" font-size="14" fill="#212121">Open dialog</text>
<path d="M24 768 H72" fill="none" stroke="#616161" stroke-width="3" stroke-dasharray="4 4" marker-end="url(#arrow-grey)" data-kind="overlay-close"/>
<text x="84" y="773" font-size="14" fill="#212121">Close dialog</text>
<text x="24" y="800" font-size="14" fill="#424242">Box borders: solid for a screen, thick for success, dashed for an error, dotted for a branch outside this flow, grey for a dialog or an empty state.</text>
</svg>
