<g data-state="requested"><rect x="704" y="114" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="716" y="136" font-size="14" font-weight="700" fill="#212121">Waiting for the keeper</text><text x="716" y="158" font-size="12" fill="#424242">Screen</text><text x="716" y="174" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">requested</text></g>
