<svg xmlns="http://www.w3.org/2000/svg" width="1888" height="710" viewBox="0 0 1888 710" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Pocket Invoice sitemap: 11 states and 19 transitions</title>
<desc id="desc">One column per screen. Each box is a state; each numbered line is a transition, listed with its cause in the transition table. Lines are styled by kind: see the legend.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#212121"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#616161"/></marker></defs>
<rect x="0" y="0" width="1888" height="710" fill="#ffffff"/>
<text x="204" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Create a workspace</text>
<text x="500" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Sign in (out of scope)</text>
<text x="796" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Invoices</text>
<text x="1092" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">New invoice</text>
<text x="1388" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Check and send</text>
<text x="1684" y="36" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">Sent</text>
<g data-state="signup"><rect x="112" y="140" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="124" y="162" font-size="14" font-weight="700" fill="#212121">Create your workspace</text><text x="124" y="184" font-size="12" fill="#424242">Screen</text><text x="124" y="200" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">signup</text></g>
<g data-state="signup-error"><rect x="112" y="292" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="3" stroke-dasharray="7 4"/><text x="124" y="314" font-size="14" font-weight="700" fill="#212121">Create your workspace:</text><text x="124" y="332" font-size="14" font-weight="700" fill="#212121">fix two problems</text><text x="124" y="354" font-size="12" fill="#424242">Error</text><text x="124" y="370" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">signup-error</text></g>
<g data-state="sign-in"><rect x="408" y="140" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2" stroke-dasharray="2 3"/><text x="420" y="162" font-size="14" font-weight="700" fill="#212121">Sign in</text><text x="420" y="184" font-size="12" fill="#424242">Outside this flow</text><text x="420" y="200" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">sign-in</text></g>
<g data-state="invoices-empty"><rect x="704" y="140" width="184" height="104" rx="6" fill="#ffffff" stroke="#616161" stroke-width="2"/><text x="716" y="162" font-size="14" font-weight="700" fill="#212121">Invoices: none yet</text><text x="716" y="184" font-size="12" fill="#424242">Empty state</text><text x="716" y="200" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">invoices-empty</text></g>
<g data-state="invoice-new"><rect x="1000" y="140" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="1012" y="162" font-size="14" font-weight="700" fill="#212121">New invoice</text><text x="1012" y="184" font-size="12" fill="#424242">Screen</text><text x="1012" y="200" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">invoice-new</text></g>
<g data-state="invoice-new-error"><rect x="1000" y="292" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="3" stroke-dasharray="7 4"/><text x="1012" y="314" font-size="14" font-weight="700" fill="#212121">New invoice: fix two</text><text x="1012" y="332" font-size="14" font-weight="700" fill="#212121">problems</text><text x="1012" y="354" font-size="12" fill="#424242">Error</text><text x="1012" y="370" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">invoice-new-error</text></g>
<g data-state="discard-dialog"><rect x="1000" y="444" width="184" height="104" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="3"/><text x="1012" y="466" font-size="14" font-weight="700" fill="#212121">Discard this invoice?</text><text x="1012" y="488" font-size="12" fill="#424242">Dialog</text><text x="1012" y="504" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">discard-dialog</text></g>
<g data-state="invoice-review"><rect x="1296" y="140" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="1308" y="162" font-size="14" font-weight="700" fill="#212121">Check the invoice</text><text x="1308" y="184" font-size="12" fill="#424242">Screen</text><text x="1308" y="200" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">invoice-review</text></g>
<g data-state="send-error"><rect x="1296" y="292" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="3" stroke-dasharray="7 4"/><text x="1308" y="314" font-size="14" font-weight="700" fill="#212121">The invoice was not</text><text x="1308" y="332" font-size="14" font-weight="700" fill="#212121">sent</text><text x="1308" y="354" font-size="12" fill="#424242">Error</text><text x="1308" y="370" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">send-error</text></g>
<g data-state="invoice-sent"><rect x="1592" y="140" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="4"/><text x="1604" y="162" font-size="14" font-weight="700" fill="#212121">Invoice INV-0001 sent</text><text x="1604" y="184" font-size="12" fill="#424242">Success</text><text x="1604" y="200" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">invoice-sent</text></g>
<g data-state="invoices-list"><rect x="704" y="292" width="184" height="104" rx="6" fill="#ffffff" stroke="#212121" stroke-width="2"/><text x="716" y="314" font-size="14" font-weight="700" fill="#212121">Invoices: one sent</text><text x="716" y="336" font-size="12" fill="#424242">Screen</text><text x="716" y="352" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, Consolas, monospace">invoices-list</text></g>
<path d="M296 202 H310 V116 H606 V175 H704" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="1"><title>1. signup to invoices-empty: Create workspace with a valid email address and a workspace name</title></path>
<circle cx="458" cy="116" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="458" y="120" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">1</text>
<path d="M296 223 H322 V327 H296" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-ink)" data-transition="2"><title>2. signup to signup-error: Create workspace with a badly formed email address or no workspace name</title></path>
<circle cx="322" cy="275" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="322" y="279" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">2</text>
<path d="M296 361 H334 V90 H618 V209 H704" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow-ink)" data-transition="3"><title>3. signup-error to invoices-empty: Fix both fields and create the workspace</title></path>
<circle cx="476" cy="90" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="476" y="94" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">3</text>
<path d="M296 161 L408 175" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#arrow-grey)" data-transition="4"><title>4. signup to sign-in: Choose I already have an account</title></path>
<circle cx="352" cy="168" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="352" y="172" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">4</text>
<path d="M408 209 L296 182" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="5"><title>5. sign-in to signup: Back to create a workspace</title></path>
<circle cx="352" cy="196" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="352" y="200" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">5</text>
<path d="M888 175 L1000 175" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="6"><title>6. invoices-empty to invoice-new: Create your first invoice</title></path>
<circle cx="944" cy="175" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="944" y="179" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">6</text>
<path d="M1184 155 L1296 166" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="7"><title>7. invoice-new to invoice-review: Check invoice with every field valid</title></path>
<circle cx="1240" cy="161" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1240" y="165" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">7</text>
<path d="M1184 185 H1198 V318 H1184" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-ink)" data-transition="8"><title>8. invoice-new to invoice-new-error: Check invoice with no client name or an amount of 0 or less</title></path>
<circle cx="1198" cy="252" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1198" y="256" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">8</text>
<path d="M1184 344 L1296 218" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow-ink)" data-transition="9"><title>9. invoice-new-error to invoice-review: Fix the fields and check the invoice</title></path>
<circle cx="1240" cy="281" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1240" y="285" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">9</text>
<path d="M1184 214 H1210 V470 H1184" fill="none" stroke="#616161" stroke-width="3" marker-end="url(#arrow-grey)" data-transition="10"><title>10. invoice-new to discard-dialog: Cancel</title></path>
<circle cx="1210" cy="342" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1210" y="346" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">10</text>
<path d="M1184 370 H1222 V522 H1184" fill="none" stroke="#616161" stroke-width="3" marker-end="url(#arrow-grey)" data-transition="11"><title>11. invoice-new-error to discard-dialog: Cancel</title></path>
<circle cx="1222" cy="446" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1222" y="450" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">11</text>
<path d="M1184 496 H1234 V229 H1184" fill="none" stroke="#616161" stroke-width="3" stroke-dasharray="4 4" marker-end="url(#arrow-grey)" data-transition="12"><title>12. discard-dialog to invoice-new: Keep editing, or press Escape</title></path>
<circle cx="1234" cy="363" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1234" y="367" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">12</text>
<path d="M1000 496 L888 209" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="13"><title>13. discard-dialog to invoices-empty: Discard</title></path>
<circle cx="944" cy="353" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="944" y="357" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">13</text>
<path d="M1296 192 L1184 170" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-transition="14"><title>14. invoice-review to invoice-new: Change details: every value is kept</title></path>
<circle cx="1240" cy="181" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1240" y="185" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">14</text>
<path d="M1480 175 L1592 175" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="15"><title>15. invoice-review to invoice-sent: Send invoice</title></path>
<circle cx="1536" cy="175" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1536" y="179" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">15</text>
<path d="M1480 209 H1494 V344 H1480" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-ink)" data-transition="16"><title>16. invoice-review to send-error: Send invoice to an address that cannot receive mail (in the example, any address ending in .invalid)</title></path>
<circle cx="1494" cy="277" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1494" y="281" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">16</text>
<path d="M1296 344 L1184 199" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow-ink)" data-transition="17"><title>17. send-error to invoice-new: Change the email address</title></path>
<circle cx="1240" cy="272" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1240" y="276" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">17</text>
<path d="M1592 209 H1506 V572 H902 V361 H888" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="18"><title>18. invoice-sent to invoices-list: Back to invoices</title></path>
<circle cx="1204" cy="572" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="1204" y="576" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">18</text>
<path d="M888 327 L1000 209" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-transition="19"><title>19. invoices-list to invoice-new: Create invoice</title></path>
<circle cx="944" cy="268" r="11" fill="#ffffff" stroke="#212121" stroke-width="1.5"/><text x="944" y="272" font-size="12" font-weight="700" fill="#212121" text-anchor="middle">19</text>
<path d="M24 638 H72" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrow-ink)" data-kind="forward"/>
<text x="84" y="643" font-size="14" fill="#212121">Forward</text>
<path d="M168 638 H216" fill="none" stroke="#616161" stroke-width="2" marker-end="url(#arrow-grey)" data-kind="branch"/>
<text x="228" y="643" font-size="14" fill="#212121">Branch</text>
<path d="M304 638 H352" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-ink)" data-kind="error"/>
<text x="364" y="643" font-size="14" fill="#212121">Error</text>
<path d="M432 638 H480" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow-ink)" data-kind="recover"/>
<text x="492" y="643" font-size="14" fill="#212121">Recover</text>
<path d="M576 638 H624" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="10 4 2 4" marker-end="url(#arrow-grey)" data-kind="back"/>
<text x="636" y="643" font-size="14" fill="#212121">Back</text>
<path d="M696 638 H744" fill="none" stroke="#616161" stroke-width="3" marker-end="url(#arrow-grey)" data-kind="overlay-open"/>
<text x="756" y="643" font-size="14" fill="#212121">Open dialog</text>
<path d="M872 638 H920" fill="none" stroke="#616161" stroke-width="3" stroke-dasharray="4 4" marker-end="url(#arrow-grey)" data-kind="overlay-close"/>
<text x="932" y="643" font-size="14" fill="#212121">Close dialog</text>
<text x="24" y="670" font-size="14" fill="#424242">Box borders: solid for a screen, thick for success, dashed for an error, dotted for a branch outside this flow, grey for a dialog or an empty state.</text>
</svg>
