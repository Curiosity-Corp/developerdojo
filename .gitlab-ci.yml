# developerdojo.org pipeline.
#   Merge requests: check, test, build, e2e.
#   PRODUCTION_E2E=true (ship-window schedules, hand runs): e2e:production only, against the live site.
#   master and the nightly schedule (02:00 UTC, so date-filtered event lists stay current):
#                   the same gates, then GitLab Pages internal preview and the publish of the BUILT
#                   site (dist, with CNAME + .nojekyll) to GitHub Curiosity-Corp/developerdojo gh-pages.
# Pattern adapted from HardMagic/website (.gitlab/ci/site-release.yml), simplified: no signed
# provenance tag, no GitLab-side gh-pages branch.
#
# DroidOpsInc/launch-sequence pipelines/static-site.yml was evaluated and not included: it assumes a
# plain-HTML source tree with no build step, deploys from the demo branch and force-pushes a
# GitLab-side gh-pages branch with a PAT. This site is an Astro build whose artifact (not source)
# must reach GitHub with a short-lived GitHub App token.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Pushes to master AND the nightly pipeline schedule (a schedule runs on master as a branch pipeline).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # A production e2e run started by hand on any branch: Run pipeline (web) or the API / glab ci run
    # (api), with PRODUCTION_E2E=true.
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $PRODUCTION_E2E == "true"'

stages:
  - validate
  - build
  - e2e
  - deploy

default:
  # Playwright image (pinned to the @playwright/test version in package-lock.json) carries Node
  # and the browsers, so one image serves every job.
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

# A production e2e pipeline (PRODUCTION_E2E=true: the ship-window schedules, or a hand run) runs
# e2e:production and nothing else: no build, no Pages, no publish. Every other job starts its rules here.
.skip-in-production-e2e:
  rules:
    - if: '$PRODUCTION_E2E == "true"'
      when: never

.node:
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - when: on_success
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --prefer-offline --no-audit --fund=false

check:
  extends: .node
  stage: validate
  script:
    - npm run check

test:
  extends: .node
  stage: validate
  script:
    - npm test

build:
  extends: .node
  stage: build
  needs: []
  script:
    - npm run build
    - test -f dist/index.html
    - test "$(cat dist/CNAME)" = "developerdojo.org"
    - test -f dist/.nojekyll
    # Published-name gate (#129): no denylisted client or unit name in any published path or text.
    - node scripts/check-published-names.mjs dist
    # Keep a producer-side fingerprint outside dist. Downstream jobs can tell
    # whether the validated Pagefind metadata survived artifact transfer.
    - test -s dist/pagefind/pagefind-entry.json
    - sha256sum dist/pagefind/pagefind-entry.json > search-index.sha256
  artifacts:
    paths:
      - dist
      - search-index.sha256
    expire_in: 7 days

# Blocking: the BIM pathway (#92). Installs the pinned IfcOpenShell and IfcTester by hash, reruns the edit and
# every check on the published IFC and IDS files, and fails if any output differs from
# public/examples/bim-pathway/generated, so the results on /katas/bim-pathway are what CI computed.
bim_pathway:
  stage: validate
  image: python:3.12-slim
  needs: []
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - when: on_success
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key:
      files:
        - public/examples/bim-pathway/tools/requirements.txt
    paths:
      - .pip/
  script:
    - python -m venv /tmp/bim-venv
    - /tmp/bim-venv/bin/pip install --require-hashes -r public/examples/bim-pathway/tools/requirements.txt
    - /tmp/bim-venv/bin/python -I public/examples/bim-pathway/tools/bim_pathway.py public/examples/bim-pathway bim-pathway-out
    - diff -r bim-pathway-out public/examples/bim-pathway/generated
  artifacts:
    when: always
    paths:
      - bim-pathway-out
    expire_in: 30 days

# Blocking: the UX pathway (#91). Node's standard library only, so nothing to install. Reruns the flow script on the
# published flow file and tokens: it redraws the sitemap, the one-canvas journey and every low-fidelity screen as
# SVG, reruns the flow and contrast checks, and fails if a check fails or any output differs from
# public/examples/ux-pathway/generated, so the files on /katas/ux-pathway are what CI computed.
ux_pathway:
  stage: validate
  needs: []
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - when: on_success
  script:
    - node public/examples/ux-pathway/tools/ux_pathway.mjs public/examples/ux-pathway ux-pathway-out
    - diff -r ux-pathway-out public/examples/ux-pathway/generated
  artifacts:
    when: always
    paths:
      - ux-pathway-out
    expire_in: 30 days

agriculture_pathway:
  stage: validate
  image: python:3.12-slim
  needs: []
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - when: on_success
  script:
    # Standard library only: nothing to install. The script refuses to write if FAO's worked examples do not reproduce.
    - python -I public/examples/agriculture-pathway/tools/agri_pathway.py public/examples/agriculture-pathway agriculture-pathway-out
    - diff -r agriculture-pathway-out public/examples/agriculture-pathway/generated
  artifacts:
    when: always
    paths:
      - agriculture-pathway-out
    expire_in: 30 days

# Blocking: the science pathway (#93). Standard library only. The script refuses to write if the GUM's worked
# examples (Annex H.2, H.3) do not reproduce, then reruns the record checks; any difference from generated/ fails.
science_pathway:
  stage: validate
  image: python:3.12-slim
  needs: []
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - when: on_success
  script:
    # Bootstrap (first pipeline only): fetch the record once so its exact bytes can be committed and hash-pinned.
    - test -f public/examples/science-pathway/inputs/gistemp-v4-global-land-ocean.csv || python -I public/examples/science-pathway/tools/fetch_input.py public/examples/science-pathway
    - python -I public/examples/science-pathway/tools/science_pathway.py public/examples/science-pathway science-pathway-out
    - diff -r science-pathway-out public/examples/science-pathway/generated
  artifacts:
    when: always
    paths:
      - science-pathway-out
      - public/examples/science-pathway/inputs
    expire_in: 30 days

# Blocking: dist/ link check. Every internal href/src/srcset in the built pages must resolve.
links:
  extends: .node
  stage: e2e
  needs: [build]
  script:
    - node scripts/check-links.mjs dist

# Weekly external link audit (schedule variable LINK_CHECK=true), also available as an optional manual
# MR job. Checks resource YAML, library/track Markdown and real outbound anchors in rendered pages,
# fetching them politely and reporting broken or unverified links. The HTML parser is installed by npm ci.
# No issue is opened (that needs a masked project access token CI variable, which does not exist yet).
external_links:
  extends: .node
  stage: e2e
  needs: [build]
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LINK_CHECK == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  script:
    - node scripts/check-external-links.mjs --rendered dist --report link-check-report.md
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - link-check-report.md

# Manual, master only: the quarterly resource refresh list (#58). A Maintainer presses play on this job in
# the latest master pipeline; stale-resources.md (resources whose verifiedOn is older than 90 days, by
# provider) is the artifact. It reads files only, needs no npm install and never fails the pipeline.
stale_resources:
  stage: e2e
  needs: []
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true
  script:
    - node scripts/list-stale-resources.mjs --report stale-resources.md
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - stale-resources.md

# Blocking: Playwright e2e over the built site: every route, nav/footer links, image wiring, no
# horizontal scroll at 390, and the axe-core WCAG 2.1 AA scan (zero serious/critical) in light and dark.
e2e:
  extends: .node
  stage: e2e
  needs: [build]
  script:
    - sha256sum -c search-index.sha256
    - npx playwright test
  artifacts:
    when: always
    paths:
      - playwright-report
      - test-results
    expire_in: 7 days

# Production e2e (hypervoid/admiral#123): the read-only production subset of the suite (playwright.config.ts
# PRODUCTION_SPECS) against https://developerdojo.org at desktop and mobile width, after each ship window.
# Pipeline schedules on master set PRODUCTION_E2E=true at 08:10, 14:10 and 20:10 UTC (the 07:00, 13:00 and
# 19:00 windows plus 70 minutes; scripts/ensure-production-e2e-schedules.sh keeps them). A hand run is
# "Run pipeline" on any branch with PRODUCTION_E2E=true. scripts/production-e2e.mjs checks that the pod
# reaches the public site (not the Ziti ingress), runs the suite, and posts pass or fail with the landing
# page screenshot on Curiosity-Corp/overview#6 when the masked CI variable CURIOSITY_OVERVIEW_NOTE_TOKEN is
# set (Azure Key Vault omlab-secrets: curiosity-overview-note-token). The note and report are artifacts.
e2e:production:
  extends: .node
  stage: e2e
  needs: []
  interruptible: false
  rules:
    - if: '$PRODUCTION_E2E == "true"'
  variables:
    E2E_BASE_URL: https://developerdojo.org
    PRODUCTION_E2E_SITE: developerdojo.org
  script:
    - node scripts/production-e2e.mjs -- npx playwright test --reporter=list,json,html
  artifacts:
    when: always
    paths:
      - production-e2e
      - playwright-report
      - test-results
    expire_in: 30 days

# Internal GitLab Pages preview of the built site.
pages:
  stage: deploy
  needs: [check, test, ux_pathway, bim_pathway, agriculture_pathway, build, e2e, links]
  interruptible: false
  script:
    - sha256sum -c search-index.sha256
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'

# Public release: the built artifact only, to GitHub gh-pages. The pages.yml workflow on that branch
# (.gitlab/ci/gh-pages-workflow.yml) deploys it to GitHub Pages at https://developerdojo.org. The job
# then waits until https://developerdojo.org/build.json reports this commit and pipeline, so a failed
# GitHub deploy turns this job red instead of leaving the previous build live (developerdojo#128).
# Protected project variables: GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID,
# GITHUB_APP_PRIVATE_KEY_B64 (masked).
# Runs on every master pipeline, including the nightly schedule, so the rebuilt site (date-filtered
# event lists evaluated at build time) always reaches GitHub Pages.
publish_github_pages:
  stage: deploy
  needs: [check, test, ux_pathway, bim_pathway, agriculture_pathway, build, e2e, links]
  interruptible: false
  resource_group: github-pages-release
  variables:
    GITHUB_PAGES_REPOSITORY: Curiosity-Corp/developerdojo
  script:
    - sha256sum -c search-index.sha256
    - bash .gitlab/ci/publish-github-pages.sh
  environment:
    name: production
    url: https://developerdojo.org
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'

# Optional diagnostic for #113. Full axe scans under two temporary CSS treatments; never replaces e2e.
# Run after the blocking suite finishes to reduce contention. Results are shared-runner observations.
catalog_a11y_profile:
  extends: .node
  stage: e2e
  needs: [build]
  timeout: 1h
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - node scripts/profile-catalog-a11y.mjs
  artifacts:
    when: always
    paths:
      - catalog-a11y-profile.json
    expire_in: 90 days

# Optional #122 investigation; it does not replace or gate the normal unit suite.
event_initialization_profile:
  extends: .node
  stage: e2e
  needs: []
  timeout: 1h
  rules:
    - !reference [.skip-in-production-e2e, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - node scripts/diagnose-event-initialization.mjs
  artifacts:
    when: always
    paths:
      - event-initialization-diagnostic.json
    expire_in: 90 days
